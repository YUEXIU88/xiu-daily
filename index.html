async function changePassword(){var cu=getCurrentUser();if(!cu){showToast('请先登录');return;}var bucket=localStorage.getItem(SK.syncBucket)||'';var o=(document.getElementById('ucOldPass')?document.getElementById('ucOldPass').value:'');var n=(document.getElementById('ucNewPass')?document.getElementById('ucNewPass').value:'');var n2=(document.getElementById('ucNewPass2')?document.getElementById('ucNewPass2').value:'');if(!o||!n){showToast('请填写完整');return;}if(n.length<4){showToast('新密码至少4位');return;}if(n!==n2){showToast('两次新密码不一致');return;}var la=localAccs()[cu];if(la){var oh=await hashPwd(la.salt,o);if(oh!==la.hash){showToast('原密码错误');return;}}else if(!bucket){showToast('找不到账号记录，请退出后重新登录再试');return;}var salt=Math.random().toString(36).slice(2,12);var hash=await hashPwd(salt,n);var rec={u:cu,salt:salt,hash:hash,createdAt:(la&&la.createdAt)||Date.now(),bucket:bucket||((la&&la.bucket)||'')};saveLocalAcc(cu,rec);function clearPw(){var a=document.getElementById('ucOldPass'),b=document.getElementById('ucNewPass'),c=document.getElementById('ucNewPass2');if(a)a.value='';if(b)b.value='';if(c)c.value='';}if(bucket){var acc=await fetchAcc(bucket,cu);if(acc&&acc.netErr){clearPw();showToast('✅ 本机密码已修改；云端暂时连不上，不影响使用');return;}if(acc&&acc.u){var ok=await putAcc(bucket,cu,rec);clearPw();if(ok)showToast('✅ 密码修改成功（本机+云端）');else showToast('本机已改，云端写入失败，请稍后重试');return;}}clearPw();showToast('✅ 密码修改成功');}
function copyTeamCode(){var b=localStorage.getItem(SK.syncBucket)||'';if(!b){showToast('还没有登录码，先点「📧 开通云同步」');return;}if(!isValidBucketId(b)){showToast('当前登录码无效，请重新开通云同步');return;}copyText(b);}
function resetCloudBucket(){var b=localStorage.getItem(SK.syncBucket)||'';if(!b){showToast('当前没有登录码');return;}if(confirm('确定要清除当前无效的登录码「'+b+'」并重新开通云同步吗？\n\n注意：本机学习数据不会丢失，但旧登录码将失效。')){localStorage.removeItem(SK.syncBucket);syncBucketId='';location.reload();}}
async function getBucketStatus(bucket){try{var r=await fetchT('https://kvdb.io/'+bucket+'/__test',{method:'PUT',body:'1'});if(r.ok)return {ok:true,status:r.status};var t='';try{t=await r.text();}catch(e){}if(r.status===403||t.toLowerCase().indexOf('not verified')>=0||t.toLowerCase().indexOf('activate')>=0)return {ok:false,reason:'unverified',status:r.status,text:t};if(r.status===404||t.indexOf('invalid')>=0)return {ok:false,reason:'invalid',status:r.status,text:t};return {ok:false,reason:'error',status:r.status,text:t};}catch(e){return {ok:false,reason:'net'};}}function cloudPutTest(bucket){return getBucketStatus(bucket).then(function(s){return s.ok;});}
function isValidBucketId(bucket){if(!bucket||typeof bucket!=='string')return false;bucket=bucket.trim();if(bucket.length<16)return false;if(/[^A-Za-z0-9_-]/.test(bucket))return false;return true;}
async function bucketStatus(bucket){if(!isValidBucketId(bucket))return {code:'invalid_format',text:'登录码格式不对（应为长串随机字符）'};try{var r=await fetchT('https://kvdb.io/'+bucket+'/__test',{method:'PUT',body:'1'},6000);if(r.ok)return {code:'ok'};if(r.status===404)return {code:'not_found',text:'登录码对应的云端桶不存在（可能被删除或输入错误）'};var txt=await r.text();if(/email|verify|verification/i.test(txt||''))return {code:'need_verify',text:'云端桶不可用，请重新开通云同步'};return {code:'write_failed',text:'云端写入失败：'+(txt||r.status)};}catch(e){return {code:'net_err',text:'网络错误，连不上 kvdb.io'};}}
async function updateUcSyncStatus(){var el=document.getElementById('ucBucketStatus');var el2=document.getElementById('ucSyncStatus');if(el2)el2.textContent=fmtSyncStatus();var bucket=localStorage.getItem(SK.syncBucket)||'';if(!bucket){if(el)el.innerHTML='<span style="color:var(--danger)">❌ 未开通云同步：手机无法登录</span>';return;}if(!isValidBucketId(bucket)){if(el)el.innerHTML='<span style="color:var(--danger)">❌ 登录码格式无效</span>';return;}var st=await getBucketStatus(bucket);if(st.ok){if(el)el.innerHTML='<span style="color:var(--success)">✅ 云端存储可读写，可以同步</span>';}else if(st.reason==='unverified'){if(el)el.innerHTML='<span style="color:var(--danger)">❌ 云端存储未验证，请点「一键开通云同步」重新绑定</span>';}else if(st.reason==='net'){if(el)el.innerHTML='<span style="color:var(--text-3)">🌐 网络检测失败，请检查网络</span>';}else{if(el)el.innerHTML='<span style="color:var(--danger)">❌ 云端存储不可用 ('+escapeHtml(st.reason||'')+')</span>';}}
function startCloudSetup(){var cu=getCurrentUser();if(!cu){showToast('请先登录后再开通');return;}cloudSetupCreate();}
async function cloudSetupCreate(){showToast('正在检测云端存储…');try{var oldB=localStorage.getItem(SK.syncBucket)||'';if(oldB){var st=await getBucketStatus(oldB);if(st.ok){showToast('当前云端存储可用');await cloudSetupFinish();return;}showToast('当前登录码不可用，正在切换…');localStorage.removeItem(SK.syncBucket);syncBucketId='';}syncBucketId=DEFAULT_BUCKET;localStorage.setItem(SK.syncBucket,DEFAULT_BUCKET);var st2=await getBucketStatus(DEFAULT_BUCKET);if(st2.ok){showToast('云端存储已开通');await cloudSetupFinish();}else{showToast('网络错误，请稍后再试');localStorage.removeItem(SK.syncBucket);syncBucketId='';}}catch(e){showToast('网络错误，请稍后再试');localStorage.removeItem(SK.syncBucket);syncBucketId='';}}
async function cloudSetupFinish(){var cu=getCurrentUser();var la=cu?localAccs()[cu]:null;if(cu&&la){var rec={u:cu,salt:la.salt,hash:la.hash,createdAt:la.createdAt||Date.now(),bucket:syncBucketId};saveLocalAcc(cu,rec);await putAcc(syncBucketId,cu,rec);}initSync();await doSync();alert('🎉 云同步开通成功！\n\n你的登录码：\n'+DEFAULT_BUCKET+'\n\n现在手机也能登录了：\n1. 点「复制」把登录码发到手机\n2. 手机打开本应用 → 登录 → 登录码框粘贴\n3. 输入账号密码，进度自动同步');location.reload();}
async function diagCloud(){var cu=getCurrentUser();var bucket=localStorage.getItem(SK.syncBucket)||'';var lines=['账号：'+(cu||'（未登录）')];lines.push('登录码：'+(bucket||'❌ 本机没有'));if(bucket){var st=await getBucketStatus(bucket);if(st.ok){lines.push('登录码检查：✅ 云端可读写');var la=cu?localAccs()[cu]:null;var acc=cu?await fetchAcc(bucket,cu):null;if(acc&&acc.netErr){lines.push('云端连接：❌ 连不上（检查网络后再试）');}else if(!acc&&la){var rec={u:cu,salt:la.salt,hash:la.hash,createdAt:la.createdAt||Date.now(),bucket:bucket};var fixed=await putAcc(bucket,cu,rec);if(fixed){saveLocalAcc(cu,rec);lines.push('云端账号：⚠️ 之前缺失，已自动修复 ✅ 现在手机可以登录了');}else{lines.push('云端账号：❌ 缺失且写入失败');}}else if(!acc){lines.push('云端账号：❌ 云端桶里没有该账号记录，需先在当前设备登录一次才能同步');}else{lines.push('云端账号：✅ 存在');}lines.push('云端写入：✅ 正常');}else if(st.reason==='unverified'){lines.push('登录码检查：❌ 云端存储未验证（KVdb 要求验证邮箱）');lines.push('');lines.push('解决方法：');lines.push('1. 点「📧 一键开通云同步」重新绑定一个可用存储');lines.push('2. 或换一个已验证的登录码');}else if(st.reason==='net'){lines.push('登录码检查：❌ 网络连接失败');lines.push('解决方法：检查网络后再试');}else if(st.reason==='invalid'){lines.push('登录码检查：❌ 登录码无效');lines.push('解决方法：从「个人中心 → 我的登录码」复制正确的长串随机字符');}else{lines.push('登录码检查：❌ '+(st.text||st.reason||'未知错误'));}}else{lines.push('');lines.push('❌ 本机没有登录码，所以手机/电脑无法互通。');lines.push('解决方法：在已有数据的设备上点「📧 一键开通云同步」即可，无需邮箱验证。');}lines.push('');lines.push('最后同步：'+fmtSyncStatus());alert('🔍 云同步诊断结果\n\n'+lines.join('\n'));}

// ==================== GLOBAL HOLIDAYS ====================
var holidayCalDate=new Date();
function holidayMatches(h,date){var m=date.getMonth()+1,dd=date.getDate();if(h.d)return h.m===m&&h.d===dd;var first=new Date(date.getFullYear(),m-1,1).getDay();var wd=h.wd==null?0:h.wd;var offset=(wd-first+7)%7;var target=1+offset+(h.wk-1)*7;return h.m===m&&dd===target;}
function getHolidaysOn(date){return HOLIDAYS.filter(function(h){return holidayMatches(h,date);});}
function nextHoliday(from){var d=new Date(from);for(var i=0;i<400;i++){d.setDate(d.getDate()+1);var hs=getHolidaysOn(d);if(hs.length)return {date:new Date(d),hs:hs};}return null;}
function renderHolidayCal(){
  var t=$('hdCalTitle'),g=$('hdCalGrid');if(!t||!g)return;
  var y=holidayCalDate.getFullYear(),m=holidayCalDate.getMonth();
  t.textContent=y+'年'+(m+1)+'月';
  var first=new Date(y,m,1).getDay();var days=new Date(y,m+1,0).getDate();
  var today=new Date();var td=today.getDate(),tm=today.getMonth(),ty=today.getFullYear();
  var wd=['日','一','二','三','四','五','六'];
  var cells=wd.map(function(w){return '<div class="hd-cell hd-wk">'+w+'</div>';}).join('');
  for(var i=0;i<first;i++)cells+='<div class="hd-cell empty"></div>';
  for(var d=1;d<=days;d++){var dt=new Date(y,m,d);var hs=getHolidaysOn(dt);var isT=(d===td&&m===tm&&y===ty);var sel=(d===holidayCalDate.getDate()&&m===holidayCalDate.getMonth()&&y===holidayCalDate.getFullYear());
    cells+='<div class="hd-cell'+(isT?' today':'')+(sel?' sel':'')+(hs.length?' has-hd':'')+'" data-d="'+d+'">'+d+(hs.length?'<i class="hd-dot"></i>':'')+'</div>';}
  g.innerHTML=cells;
  g.querySelectorAll('.hd-cell[data-d]').forEach(function(c){c.addEventListener('click',function(){holidayCalDate=new Date(y,m,parseInt(c.dataset.d,10));renderHolidayCal();showHolidayDetail(holidayCalDate);});});
}
function showHolidayDetail(date){
  var el=$('hdDetail');if(!el)return;
  if(!date){el.innerHTML='<div class="card"><div class="section-title">🎉 节日详情</div><p class="uc-hint">点击日历中的日期，查看当天节日与祝福语</p></div>';return;}
  var hs=getHolidaysOn(date);
  if(!hs.length){el.innerHTML='<div class="card"><div class="section-title">🎉 '+fmtDate(date)+'</div><p class="uc-hint">这一天没有收录的节日，试试其他日期吧</p></div>';return;}
  var html='<div class="card"><div class="section-title">🎉 '+fmtDate(date)+'</div>'+hs.map(function(h,i){
    var w=(h.wishes||[]).map(function(w2,j){return '<div class="hd-wish"><div class="hd-wish-txt">'+escapeHtml(w2)+'</div><div class="hd-wish-acts"><button class="btn btn-sm" data-wish="'+i+'_'+j+'" data-txt="'+escapeAttr(w2)+'">📋 复制</button><button class="btn btn-sm" data-speak="'+i+'_'+j+'" data-txt="'+escapeAttr(w2)+'">🔊 朗读</button></div></div>';}).join('');
    return '<div class="hd-item"><div class="hd-name">'+escapeHtml(h.name)+' <span class="hd-country">'+escapeHtml(h.country)+'</span></div><div class="hd-desc">'+escapeHtml(h.desc)+'</div>'+(w?'<div class="hd-wishes">'+w+'</div>':'')+'</div>';}).join('')+'</div>';
  el.innerHTML=html;
  el.querySelectorAll('[data-wish]').forEach(function(b){b.addEventListener('click',function(){copyText(b.dataset.txt);showToast('已复制祝福语');});});
  el.querySelectorAll('[data-speak]').forEach(function(b){b.addEventListener('click',function(){speakText(b.dataset.txt);});});
}

// ==================== VERSION / FORCE UPDATE ====================
async function checkRemoteVersion(){
  try{
    // 同一标签页会话内只检查一次，避免 reload 后重复联网检查
    var checked;try{checked=sessionStorage.getItem('xiu_remote_checked');}catch(e){}
    if(checked==='1')return false;
    try{sessionStorage.setItem('xiu_remote_checked','1');}catch(e){}
    // V44: 2.5s 超时——网络慢时绝不让版本检查阻塞首屏
    var resp=await fetchT('version.json?t='+Date.now(),{cache:'no-store'},2500);
    if(!resp.ok)return false;
    var data=await resp.json();
    var remoteV=parseInt(data.v||0,10);
    if(!remoteV)return false;
    var storedV=parseInt(localStorage.getItem('xiu_remote_ver')||'0',10);
    if(storedV&&storedV<remoteV){
      // New version detected, force update
      localStorage.setItem('xiu_remote_ver',String(remoteV));
      await forceHardReload('检测到新版 V'+remoteV+'，正在清理旧缓存…');
      return true;
    }
    localStorage.setItem('xiu_remote_ver',String(remoteV));
  }catch(e){}
  return false;
}
// V44: 隐藏加载屏（动画淡出）
function hideLoading(force){
  var ls=document.getElementById('loadingScreen');
  if(!ls)return;
  if(force){ls.style.display='none';return;}
  ls.classList.add('hidden');
  setTimeout(function(){ls.style.display='none';},500);
}
async function forceHardReload(msg){
  if(msg&&typeof showToast==='function')showToast(msg);
  try{
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<regs.length;i++){try{await regs[i].unregister();}catch(e){}}
    }
  }catch(e){}
  try{
    var keys=await caches.keys();
    for(var i=0;i<keys.length;i++){try{await caches.delete(keys[i]);}catch(e){}}
  }catch(e){}
  setTimeout(function(){location.reload();},800);
}
function forceUpdateBtnClick(){
  if(!confirm('确定要强制更新吗？\n\n这会清空所有缓存并重新加载最新版本。\n当前数据不会丢失（数据保存在云端和 localStorage）。'))return;
  forceHardReload('正在清理旧缓存…');
}
async function diagSync(){
  var lines=[];
  var appV=APP_VERSION;
  var storedV=parseInt(localStorage.getItem('xiu_app_ver')||'0',10);
  var remoteV=parseInt(localStorage.getItem('xiu_remote_ver')||'0',10);
  lines.push('📦 应用版本：本地 V'+appV+' · 浏览器缓存 V'+storedV+' · 远程 V'+remoteV);
  if(appV>storedV){lines.push('⚠️ 浏览器还在用旧版本，请点下方「🔄 强制更新」按钮');}
  var cu=getCurrentUser();
  lines.push('👤 当前用户：'+(cu||'❌ 未登录'));
  if(cu){
    var av=getAvatar();
    lines.push('🖼️ 本地头像：'+(av?'✅ 有 ('+Math.round(av.length/1024)+'KB)':'❌ 无'));
  }
  var bucket=localStorage.getItem(SK.syncBucket)||'';
  lines.push('🔑 本地登录码：'+(bucket||'❌ 空'));
  var la=cu?localAccs()[cu]:null;
  if(la){
    lines.push('📋 本地账号记录：✅ 有（bucket='+(la.bucket||'空')+'）');
  }else if(cu){
    lines.push('📋 本地账号记录：❌ 无');
  }
  if(bucket&&cu){
    lines.push('--- 正在检测云端 ---');
    var acc=await fetchAcc(bucket,cu,8000);
    if(acc&&acc.netErr){
      lines.push('❌ 云端连接失败（检查网络或 kvdb.io 是否可访问）');
    }else if(!acc){
      lines.push('❌ 云端没找到该账号（acc_'+cu+' 不存在）');
      lines.push('💡 手机端能登入但 PC 端不能，通常是这个原因');
    }else{
      lines.push('✅ 云端账号存在');
      // Try fetching data
      try{
        var dResp=await fetchT('https://kvdb.io/'+bucket+'/ud_'+encodeURIComponent(cu),{},8000);
        if(dResp.ok){
          var dData=await dResp.json();
          if(dData&&dData.v){
            var sCount=(dData.userSentences||[]).length;
            var pCount=(dData.spProducts||[]).length;
            lines.push('✅ 云端数据可拉取：句子 '+sCount+' 条，产品 '+pCount+' 个');
          }else{
            lines.push('⚠️ 云端数据为空（v 字段缺失）');
          }
        }else{
          lines.push('❌ 云端数据拉取失败：HTTP '+dResp.status);
        }
      }catch(e){
        lines.push('❌ 云端数据拉取异常：'+e.message);
      }
      // Try avatar
      try{
        var avResp=await fetchT('https://kvdb.io/'+bucket+'/ud_'+encodeURIComponent(cu)+'_avatar',{},8000);
        if(avResp.ok){
          var avData=await avResp.json();
          lines.push('✅ 云端头像可拉取'+(avData&&avData.a?'（'+(avData.a.length/1024).toFixed(1)+'KB）':'（但为空）'));
        }else if(avResp.status===404){
          lines.push('⚠️ 云端没存头像（手机端未上传头像）');
        }else{
          lines.push('❌ 云端头像拉取失败：HTTP '+avResp.status);
        }
      }catch(e){}
    }
  }
  lines.push('---');
  lines.push('📌 解决方案：');
  if(appV>storedV){lines.push('1. 点「🔄 强制更新」刷新到最新版');}
  if(bucket&&cu&&(!acc||acc.netErr)){lines.push('2. 检查网络，或稍后再试');}
  if(!bucket){lines.push('1. 登录码为空 → 在已登录设备「个人中心」复制登录码');}
  alert('🔍 同步诊断报告\n\n'+lines.join('\n'));
}

    if(ls){ls.style.display='none';}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee;color:#c00;font:13px monospace;padding:16px;white-space:pre-wrap;word-break:break-all';
    d.textContent='JS Error: '+msg+'\nLine: '+line+':'+col+'\n'+(err&&err.stack?err.stack:'');
    document.body.appendChild(d);
  }catch(e){}
  return false;
};
async function init(){
  // V44: 兜底——无论网络多慢，最多转 7 秒强制隐藏加载屏（旧版此兜底排在 await 之后，网络挂起时根本执行不到）
  setTimeout(function(){hideLoading(true);},7000);
try{
  // 本地版本升级判断（无需网络）
  var storedVer=parseInt(localStorage.getItem('xiu_app_ver')||'0',10);
  if(storedVer&&storedVer<APP_VERSION){
    localStorage.setItem('xiu_app_ver',String(APP_VERSION));
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});});}
    location.reload();return;
  }
  localStorage.setItem('xiu_app_ver',String(APP_VERSION));
  var dataP=fetchT('data.json',{},4000).then(function(r){return r&&r.ok?r.json():null;}).catch(function(){return null;});
  var data=await dataP;
  if(data){
    DEFAULT_SENTENCES=data.sentences||[];TV_SHOWS=data.tvShows||[];GEN_TEMPLATES=data.genTemplates||[];EMAIL_TEMPLATES=data.emailTemplates||[];SCENARIOS=data.scenarios||[];SHOPEE_EN=data.shopeeEn||[];HOLIDAYS=data.holidays||[];COMMON_WORDS=data.commonWords||[];
  }
  loadAllData();
  rebuildAllSentences();applyCustomOrder();ensureUserPatterns();
  initTTS();
  renderSidebar();
  setTheme(currentTheme);
  var mb=$('menuBtn');if(mb)mb.addEventListener('click',openSidebar);
  var sc=$('sidebarClose');if(sc)sc.addEventListener('click',closeSidebar);
  var ov=$('sidebarOverlay');if(ov)ov.addEventListener('click',closeSidebar);
  var tt=$('themeToggle');if(tt)tt.addEventListener('click',toggleTheme);
  var nb=$('navBackBtn');if(nb)nb.addEventListener('click',goBack);
  var nh=$('navHomeBtn');if(nh)nh.addEventListener('click',goHome);
  var rf=$('navRefreshBtn');if(rf)rf.addEventListener('click',function(){try{sessionStorage.setItem('xiu_scroll_top',String(window.scrollY||0));}catch(e){}location.reload();});
  initSync();
  startAutoSync();
  // V44: 先用本地数据渲染首帧，不等云同步
  if(currentModule==='en-daily'&&MODULES['en-daily']){switchModule('en-daily');}else{switchModule(currentModule);}
  try{var stTop=parseInt(sessionStorage.getItem('xiu_scroll_top')||'0',10);if(stTop>0){setTimeout(function(){window.scrollTo(0,stTop);try{sessionStorage.removeItem('xiu_scroll_top');}catch(e){}},100);}}catch(e){}
  hideLoading(false);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW register failed',e);});}
  checkRemoteVersion();
  // V44: 云同步后台拉取，完成后刷新当前视图（不再阻塞首屏）
  if(syncBucketId){
    pullSyncData().then(function(ok){
      if(ok){
        try{var cur=currentModule;if(cur&&MODULES[cur]){switchModule(cur,true);}}catch(e){}
        try{updateAvatarUI();}catch(e){}
      }
    }).catch(function(){});
  }
  var ucChip=$('userChip');if(ucChip){updateAvatarUI();ucChip.addEventListener('click',function(){switchModule('uc-center');});}
  var alt=document.getElementById('authTabLogin');if(alt)alt.addEventListener('click',function(){setAuthMode('login');});
  var art=document.getElementById('authTabReg');if(art)art.addEventListener('click',function(){setAuthMode('reg');});
  var agt=document.getElementById('authGuestLink');if(agt)agt.addEventListener('click',continueAsGuest);
  var amk=document.getElementById('authMask');if(amk)amk.addEventListener('click',function(e){if(e.target===amk)continueAsGuest();});
  // V39: Bind diagnostic & force update buttons on auth gate
  var dBtn=document.getElementById('authDiagBtn');
  if(dBtn)dBtn.addEventListener('click',diagSync);
  var uBtn=document.getElementById('authForceUpdateBtn');
  if(uBtn)uBtn.addEventListener('click',forceUpdateBtnClick);
  if(getAuthState()!=='user'&&getAuthState()!=='guest'){showAuthGate();setAuthMode('login');}
  setTimeout(maybeAutoUpdateRates,2500); // V31：启动后静默更新当天汇率
}catch(e){
  console.error('init() error:',e);
  hideLoading(true);
  var ed=document.createElement('div');
  ed.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee;color:#c00;font:13px monospace;padding:16px;white-space:pre-wrap;word-break:break-all';
  ed.textContent='Init Error: '+(e&&e.message?e.message:String(e))+'\nStack: '+(e&&e.stack?e.stack:'');
  document.body.appendChild(ed);
}
}
init();
</script>
