<!DOCTYPE html>
<html lang="zh-CN" data-theme="warm">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="外贸工作台">
<meta name="theme-color" content="#0d7377">
<link rel="manifest" href="manifest.json">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>外贸工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="warm"]{
--bg:#f7f5f0;--bg-grad:linear-gradient(160deg,#ede8df 0%,#f7f5f0 280px);
--card:#ffffff;--card-hover:#fdfcf9;
--text:#1a1a2e;--text-2:#5c5c6e;--text-3:#a0a0ac;
--primary:#0d7377;--primary-d:#0a5c5f;--primary-l:#e0f2f1;
--accent:#c99a3e;--accent-l:#faf5ea;
--border:#e8e5df;--border-l:#f2f0eb;
--shadow:0 1px 3px rgba(40,30,20,.05),0 1px 2px rgba(40,30,20,.03);
--shadow-md:0 6px 20px rgba(40,30,20,.07),0 2px 6px rgba(40,30,20,.03);
--shadow-hover:0 12px 36px rgba(40,30,20,.1),0 4px 12px rgba(40,30,20,.04);
--r:18px;--r-sm:12px;--r-xs:8px;
--tr:.25s cubic-bezier(.4,0,.2,1);
--serif:'Lora','Noto Serif SC',Georgia,serif;
--sans:'Inter','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
--danger:#dc2626;--success:#16a34a;
--sidebar-w:250px;--topbar-h:52px;
--red:#dc2626;--green:#16a34a;--blue:#2563eb;--orange:#ea580c;--purple:#9333ea;
}
[data-theme="ocean"]{
--bg:#f0f6ff;--bg-grad:linear-gradient(160deg,#dbeafe 0%,#f0f6ff 280px);
--card:#ffffff;--card-hover:#f5faff;
--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
--primary:#2563eb;--primary-d:#1d4ed8;--primary-l:#dbeafe;
--accent:#7c3aed;--accent-l:#f3e8ff;
--border:#dbe5f0;--border-l:#eef2f7;
--shadow:0 1px 3px rgba(30,50,80,.05),0 1px 2px rgba(30,50,80,.03);
--shadow-md:0 6px 20px rgba(30,50,80,.07),0 2px 6px rgba(30,50,80,.03);
--shadow-hover:0 12px 36px rgba(30,50,80,.1),0 4px 12px rgba(30,50,80,.04);
--danger:#dc2626;--success:#16a34a;
}
[data-theme="forest"]{
--bg:#f0f7f0;--bg-grad:linear-gradient(160deg,#dcfce7 0%,#f0f7f0 280px);
--card:#ffffff;--card-hover:#f5fdf5;
--text:#1a2e1a;--text-2:#4d6b4d;--text-3:#8aaa8a;
--primary:#15803d;--primary-d:#166534;--primary-l:#dcfce7;
--accent:#ca8a04;--accent-l:#fef9c3;
--border:#d5e8d5;--border-l:#eaf2ea;
--shadow:0 1px 3px rgba(20,50,20,.05),0 1px 2px rgba(20,50,20,.03);
--shadow-md:0 6px 20px rgba(20,50,20,.07),0 2px 6px rgba(20,50,20,.03);
--shadow-hover:0 12px 36px rgba(20,50,20,.1),0 4px 12px rgba(20,50,20,.04);
--danger:#dc2626;--success:#16a34a;
}
[data-theme="sunset"]{
--bg:#fdf4ff;--bg-grad:linear-gradient(160deg,#fae8ff 0%,#fdf4ff 280px);
--card:#ffffff;--card-hover:#fdf8ff;
--text:#2d1b2e;--text-2:#6b4c6e;--text-3:#a890aa;
--primary:#9333ea;--primary-d:#7e22ce;--primary-l:#f3e8ff;
--accent:#e11d48;--accent-l:#ffe4e6;
--border:#efdce8;--border-l:#f7eef3;
--shadow:0 1px 3px rgba(60,20,50,.05),0 1px 2px rgba(60,20,50,.03);
--shadow-md:0 6px 20px rgba(60,20,50,.07),0 2px 6px rgba(60,20,50,.03);
--shadow-hover:0 12px 36px rgba(60,20,50,.1),0 4px 12px rgba(60,20,50,.04);
--danger:#dc2626;--success:#16a34a;
}
[data-theme="dark"]{
--bg:#0d0d11;--bg-grad:linear-gradient(160deg,#16161e 0%,#0d0d11 280px);
--card:#1a1a22;--card-hover:#21212c;
--text:#e8e8ea;--text-2:#9999a4;--text-3:#55555f;
--primary:#5eead4;--primary-d:#2dd4bf;--primary-l:rgba(94,234,212,.08);
--accent:#d4b878;--accent-l:rgba(212,184,120,.08);
--border:#2a2a35;--border-l:#22222c;
--shadow:0 1px 3px rgba(0,0,0,.2);--shadow-md:0 6px 20px rgba(0,0,0,.3);--shadow-hover:0 12px 36px rgba(0,0,0,.4);
--danger:#f87171;--success:#4ade80;
}
[data-theme="midnight"]{
--bg:#0a0f1e;--bg-grad:linear-gradient(160deg,#111827 0%,#0a0f1e 280px);
--card:#141c2f;--card-hover:#1a2438;
--text:#e2e8f0;--text-2:#94a3b8;--text-3:#475569;
--primary:#60a5fa;--primary-d:#3b82f6;--primary-l:rgba(96,165,250,.1);
--accent:#a78bfa;--accent-l:rgba(167,139,250,.08);
--border:#1e293b;--border-l:#172033;
--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 6px 20px rgba(0,0,0,.4);--shadow-hover:0 12px 36px rgba(0,0,0,.5);
--danger:#f87171;--success:#4ade80;
}
body{font-family:var(--sans);background:var(--bg-grad);background-attachment:fixed;color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

/* ===== Loading Screen ===== */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;animation:lsForceFade 0.4s ease 4s forwards}
@keyframes lsForceFade{from{opacity:1}to{opacity:0;visibility:hidden}}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-size:48px;margin-bottom:12px;animation:bounce 1s ease infinite}
.loading-title{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.loading-sub{font-size:13px;color:var(--text-3);margin-top:4px}
.loading-bar{width:160px;height:3px;background:var(--border);border-radius:2px;margin-top:20px;overflow:hidden}
.loading-bar-fill{height:100%;background:var(--primary);border-radius:2px;animation:loadbar 1.2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes loadbar{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ===== Sidebar ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);z-index:1000;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-md)}
.sidebar.open{transform:translateX(0)}
.sidebar-header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border-l);min-height:var(--topbar-h)}
.sidebar-logo{font-size:22px}
.sidebar-title{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;flex:1}
.sidebar-close{display:none;background:none;border:none;font-size:18px;color:var(--text-3);cursor:pointer;padding:4px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.nav-group{margin-bottom:2px}
.nav-group-header{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);transition:var(--tr);user-select:none}
.nav-group-header:hover{background:var(--primary-l);color:var(--primary)}
.nav-group-header .nav-icon{font-size:16px;width:20px;text-align:center}
.nav-group-header .nav-arrow{margin-left:auto;font-size:10px;color:var(--text-3);transition:transform .2s}
.nav-group.collapsed .nav-arrow{transform:rotate(-90deg)}
.nav-group-items{overflow:hidden;max-height:500px;transition:max-height .3s ease}
.nav-group.collapsed .nav-group-items{max-height:0}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 44px;cursor:pointer;font-size:13px;color:var(--text-2);transition:var(--tr);position:relative}
.nav-item:hover{background:var(--primary-l);color:var(--primary)}
.nav-item.active{background:var(--primary-l);color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .nav-icon{font-size:14px}
.nav-badge{margin-left:auto;background:var(--primary);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;min-width:18px;text-align:center}
.nav-subgroup{margin:2px 0 4px}
.nav-subgroup-header{display:flex;align-items:center;gap:6px;padding:6px 16px 4px 30px;font-size:11px;font-weight:600;color:var(--text-3);cursor:default;user-select:none}
.nav-subgroup-header .nav-icon{font-size:12px;width:16px;text-align:center}
.nav-subgroup .nav-item{padding-left:54px;font-size:12.5px}
.sidebar-footer{padding:10px 16px;border-top:1px solid var(--border-l);display:flex;gap:8px}
.sidebar-sync-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer;transition:var(--tr)}
.sidebar-sync-btn:hover{border-color:var(--primary);color:var(--primary)}
.sidebar-sync-btn.synced{color:var(--success);border-color:var(--success)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;opacity:0;transition:opacity .3s}
.sidebar-overlay.show{display:block;opacity:1}

/* ===== Main ===== */
.main{margin-left:0;min-height:100vh;transition:margin .3s}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--topbar-h);background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.topbar-menu{display:flex;background:none;border:none;font-size:20px;color:var(--text);cursor:pointer;padding:4px;align-items:center;justify-content:center}
.topbar-title{flex:1;font-size:16px;font-weight:600;color:var(--text)}
.topbar-actions{display:flex;gap:6px;align-items:center}
.topbar-btn{background:none;border:1px solid var(--border);border-radius:var(--r-xs);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-size:16px;transition:var(--tr)}
.topbar-btn:hover{border-color:var(--primary);color:var(--primary)}
#navBackBtn{font-size:22px;font-weight:bold;padding-bottom:2px}
#navHomeBtn{font-size:18px}
.content{max-width:1400px;margin:0 auto;padding:16px}
.module-view{display:none;animation:fade .3s ease}
.module-view.active{display:block}

/* ===== Common Components ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:var(--r-xs);font-size:14px;font-weight:500;cursor:pointer;transition:var(--tr);font-family:var(--sans)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-ghost{background:var(--card);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--danger);color:#fff}
.act-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer;transition:var(--tr)}
.act-btn:hover{border-color:var(--primary);color:var(--primary)}
.act-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.act-btn.fav-active{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:var(--tr)}
.card:hover{box-shadow:var(--shadow-md)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-3)}
.empty-state-icon{font-size:40px;margin-bottom:8px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xs);padding:0 12px;flex:1}
.search-box input{flex:1;border:none;outline:none;background:transparent;padding:8px 0;font-size:14px;color:var(--text);font-family:var(--sans)}
.search-box svg{color:var(--text-3);flex-shrink:0}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:4px}
.form-input,.form-textarea,.form-select{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-xs);font-size:14px;background:var(--card);color:var(--text);outline:none;transition:var(--tr);font-family:var(--sans)}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.form-textarea{resize:vertical;min-height:80px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:var(--r-xs);font-size:13px;z-index:9999;transition:transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.section-title{font-size:15px;font-weight:600;color:var(--text);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.en-toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.en-toolbar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.en-level-row{justify-content:space-between}
.level-filter{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lv-chip{font-size:12.5px;font-family:var(--sans);padding:5px 13px;border:1px solid var(--border);background:var(--card);color:var(--text-2);border-radius:999px;cursor:pointer;transition:var(--tr);white-space:nowrap}
.lv-chip:hover{border-color:var(--primary);color:var(--primary)}
.lv-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.user-level-wrap{display:flex;align-items:center;gap:6px}
.ul-label{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.ul-select{padding:5px 10px;font-size:12.5px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text-2);outline:none;cursor:pointer;font-family:var(--sans)}
.ul-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
.stats-bar{display:flex;justify-content:center;gap:24px;margin:14px 0}
.stat-item{display:flex;flex-direction:column;align-items:center}
.stat-item strong{font-size:22px;font-weight:700;color:var(--primary)}
.stat-item span{font-size:11px;color:var(--text-3)}

/* ===== Data Table ===== */
.data-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow)}
.data-table th{background:var(--primary-l);color:var(--primary);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0}
.data-table td{padding:8px 10px;border-top:1px solid var(--border-l);color:var(--text)}
.data-table tr:hover td{background:var(--card-hover)}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums}
.data-table .profit-pos{color:var(--success);font-weight:600}
.data-table .profit-neg{color:var(--danger);font-weight:600}
.table-wrap{overflow-x:auto;border-radius:var(--r-sm);box-shadow:var(--shadow)}

/* ===== Import Dialog ===== */
.import-dialog{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:12px}
.import-dialog textarea{width:100%;min-height:120px;padding:10px;border:1px solid var(--border);border-radius:var(--r-xs);font-size:12px;font-family:monospace;background:var(--bg);color:var(--text);resize:vertical}
.import-hint{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.5}

/* ===== English Module ===== */
.tabs-wrap{overflow-x:auto;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.tab{display:flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);color:var(--text-2);font-size:13px;cursor:pointer;transition:var(--tr);white-space:nowrap}
.tab:hover{border-color:var(--primary)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab-count{background:var(--primary-l);color:var(--primary);font-size:10px;padding:1px 6px;border-radius:8px}
.tab.active .tab-count{background:rgba(255,255,255,.2);color:#fff}
.card-en{font-size:16px;line-height:1.5;color:var(--text);margin:8px 0 4px;font-family:var(--serif);white-space:pre-line}
.card-zh{font-size:13px;color:var(--text-2);margin-bottom:8px;white-space:pre-line}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-serial{font-size:12px;color:var(--text-3);font-weight:600}
.card-tags{display:flex;gap:4px;flex-wrap:wrap}
.card-tag{font-size:10px;padding:2px 8px;border-radius:10px}
.card-tag.lv-A1{background:#dcfce7;color:#15803d}
.card-tag.lv-A2{background:#dbeafe;color:#1d4ed8}
.card-tag.lv-B1{background:#fef3c7;color:#b45309}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drag-handle{margin-left:auto;color:var(--text-3);cursor:grab;font-size:16px}
.word{cursor:pointer;border-bottom:1px dashed var(--text-3);transition:var(--tr)}
.word:hover{color:var(--primary);border-color:var(--primary)}
.pattern-section{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
.pattern-toggle{font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;padding:4px 0}
.pattern-content{display:none;padding-top:6px}
.pattern-section.expanded .pattern-content{display:block}
.pat-block{font-size:13px;margin-bottom:6px;line-height:1.5}
.pat-explain{color:var(--text)}
.pat-native{color:var(--accent)}
.pat-variations{color:var(--text-2)}
.pv-en{font-size:13px;color:var(--text)}
.pv-zh{font-size:12px;color:var(--text-3);margin-left:8px}
.pv-say-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--primary);padding:0 4px}
.add-panel{max-height:0;overflow:hidden;transition:max-height .35s ease}
.add-panel.open{max-height:800px}
.add-panel-inner{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:12px}
.mode-toggle{display:flex;gap:6px;margin-bottom:12px}
.mode-btn{flex:1;padding:6px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer;transition:var(--tr)}
.mode-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}.seg-toggle{display:flex;width:fit-content;margin:2px 0 8px;border:1px solid var(--border);border-radius:var(--r-xs);overflow:hidden}.seg-btn{padding:5px 14px;border:none;background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer;transition:var(--tr)}.seg-btn.active{background:var(--primary);color:#fff}.seg-btn+.seg-btn{border-left:1px solid var(--border)}#batchInput{min-height:120px}
.mode-panel{display:none}
.mode-panel.active{display:block}
.input-actions{display:flex;gap:6px;margin-top:6px}
.input-action-btn{display:flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer}
.input-action-btn:hover{border-color:var(--primary);color:var(--primary)}
.input-action-btn.loading{opacity:.5;pointer-events:none}
.translate-row{display:flex;gap:8px;align-items:flex-end}
.translate-row .form-group{flex:1}
.translate-btn{padding:8px 12px;border:1px solid var(--primary);border-radius:var(--r-xs);background:var(--primary-l);color:var(--primary);font-size:13px;cursor:pointer;white-space:nowrap}
.grammar-section{background:var(--accent-l);border:1px solid var(--accent);border-radius:var(--r-xs);padding:10px;margin:8px 0}
.grammar-corrected{background:var(--success);color:#fff;padding:8px;border-radius:var(--r-xs);margin-bottom:6px}
.grammar-corrected-label{font-size:12px;font-weight:600;margin-bottom:4px}
.grammar-corrected-sentence{font-size:14px;font-family:var(--serif)}
.grammar-corrected-actions{display:flex;gap:6px;margin-top:6px}
.grammar-act-btn{background:rgba(255,255,255,.2);color:#fff;border:none;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.grammar-item{background:var(--card);border-radius:var(--r-xs);padding:6px 8px;margin-bottom:4px}
.grammar-error{font-size:12px;color:var(--danger)}
.grammar-suggest{font-size:12px;margin-top:2px}
.grammar-adopt{color:var(--primary);cursor:pointer;text-decoration:underline}
.dup-warning{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r-xs);padding:8px;margin:6px 0;display:none}
.dup-warning.show{display:block}
.dup-warning-title{font-size:12px;font-weight:600;margin-bottom:4px}
.dup-warning-item{font-size:12px;margin-bottom:2px}
.dup-en{color:var(--text-2);font-style:italic}
.gen-suggestion{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xs);padding:12px;margin-bottom:8px;cursor:pointer;transition:var(--tr);animation:slideIn .3s ease}
.gen-suggestion:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.gen-suggestion-en{font-size:15px;font-family:var(--serif);color:var(--text);margin-bottom:4px}
.gen-suggestion-zh{font-size:13px;color:var(--text-2)}
.gen-suggestion-actions{display:flex;gap:6px;margin-top:8px;align-items:center}
.gen-suggestion-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--primary-l);color:var(--primary)}
.gen-suggestion-use{margin-left:auto;padding:4px 10px;border:1px solid var(--primary);border-radius:var(--r-xs);background:var(--primary);color:#fff;font-size:12px;cursor:pointer}
.tr-result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xs);padding:12px;margin-bottom:8px}
.tr-result-style{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:4px}
.tr-result-en{font-size:15px;font-family:var(--serif);color:var(--text);margin-bottom:6px}
.tr-result-actions{display:flex;gap:6px}
.style-chips{display:flex;gap:6px;margin:10px 0}
.style-chip{padding:4px 10px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text-2);font-size:12px;cursor:pointer}
.style-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.custom-cat-row{display:none;margin-top:8px;padding:8px;background:var(--bg);border-radius:var(--r-xs)}
.custom-cat-inputs{display:flex;gap:6px}
.cat-emoji-input{width:50px;text-align:center}
.cat-suggest-emojis{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.cat-emoji-pick{cursor:pointer;font-size:18px;padding:2px 4px;border-radius:4px;transition:var(--tr)}
.cat-emoji-pick:hover{background:var(--primary-l)}
.panel-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:12px}
.settings-section h3{font-size:14px;font-weight:600;margin-bottom:10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.setting-label{font-size:13px;color:var(--text-2)}
.setting-select{padding:5px 8px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);color:var(--text);font-size:13px}
.setting-range{width:120px}
.setting-value{font-size:13px;color:var(--primary);min-width:36px}
.test-btn{padding:5px 12px;border:1px solid var(--primary);border-radius:var(--r-xs);background:var(--primary-l);color:var(--primary);font-size:12px;cursor:pointer}
.tts-status{font-size:12px;margin-top:6px}
.tts-status.ok{color:var(--success)}
.tts-status.fail{color:var(--danger)}
.open-external{display:inline-block;margin-top:8px;color:var(--primary);font-size:13px;cursor:pointer}
.theme-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{border:2px solid var(--border);border-radius:var(--r-xs);padding:6px;cursor:pointer;transition:var(--tr);text-align:center}
.theme-card.active{border-color:var(--primary)}
.theme-preview{height:36px;border-radius:4px;position:relative;overflow:hidden;margin-bottom:4px}
.tp-bg{position:absolute;inset:0}
.tp-card{position:absolute;left:4px;right:4px;bottom:4px;height:12px;border-radius:2px}
.theme-name{font-size:12px;font-weight:600}
.theme-desc{font-size:10px;color:var(--text-3)}

/* Word Popover */
.word-popover-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.word-popover-mask.show{opacity:1;pointer-events:auto}
.word-popover{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:16px;max-height:75vh;overflow-y:auto;z-index:2001;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -4px 24px rgba(0,0,0,.15)}
.word-popover.show{transform:translateY(0)}
.wpop-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px}
.wpop-close{position:absolute;top:10px;right:12px;width:32px;height:32px;border:none;background:var(--bg);border-radius:50%;font-size:16px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr);z-index:5}
.wpop-close:hover{background:var(--border-l);color:var(--text)}
.wpop-title-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wpop-title-area{flex:1}
.wpop-title{font-size:22px;font-weight:700;font-family:var(--serif);color:var(--text)}
.wpop-title-btns{display:flex;gap:4px;margin-top:4px}
.wpop-title-say,.wpop-title-copy{background:none;border:1px solid var(--border);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--primary)}
.wpop-fav-btn{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);font-size:12px;cursor:pointer;color:var(--text-2)}
.wpop-fav-btn.fav-active{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.wpop-loading,.wpop-empty{text-align:center;padding:20px;color:var(--text-3);font-size:13px}
.wpop-phons{margin-bottom:8px}
.wpop-phon{font-size:13px;margin-right:12px}
.wpop-phon-label{font-size:10px;color:var(--text-3);margin-right:2px}
.wpop-phon-none{font-size:12px;color:var(--text-3);font-style:italic}
.wpop-usage{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.wpop-usage-label{font-size:11px;color:var(--text-3)}
.wpop-usage-tag{font-size:11px;padding:1px 8px;border-radius:8px;background:var(--primary-l);color:var(--primary)}
.wpop-exam{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--accent-l);color:var(--accent)}
.wpop-section{font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--text)}
.wpop-defs .wpop-def{font-size:13px;padding:3px 0;color:var(--text)}
.wpop-pos{font-size:11px;color:var(--primary);font-weight:600;margin-right:4px;font-style:italic}
.wpop-wfs{display:flex;flex-wrap:wrap;gap:6px}
.wpop-wf{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:4px}
.wpop-wf i{font-style:normal;color:var(--text-3);font-size:10px;margin-right:2px}
.wpop-phrase{padding:6px 0;font-size:13px;border-bottom:1px dashed var(--border-l)}
.wpop-phrase:last-child{border-bottom:none}
.wpop-phrase-top{display:flex;justify-content:space-between;gap:8px}
.wpop-phrase-en{color:var(--text);font-weight:500}
.wpop-phrase-zh{color:var(--text-2);text-align:right}
.wpop-phrase-detail{margin-top:4px;padding-left:8px;font-size:12px;color:var(--text-3);line-height:1.5}
.wpop-phrase-explain{color:var(--text-2)}
.wpop-phrase-usage{color:var(--text-3)}
.wpop-phrase-ex{color:var(--primary);font-style:italic;margin-top:2px}
.wpop-syno{display:flex;gap:6px;padding:3px 0;align-items:center}
.wpop-syno-words{display:flex;flex-wrap:wrap;gap:4px}
.wpop-syno-word{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:4px;cursor:pointer;color:var(--primary)}
.wpop-syno-word:hover{background:var(--primary-l)}
.wpop-syno-tran{font-size:11px;color:var(--text-3)}
.wpop-relwords{display:flex;flex-direction:column;gap:4px}
.wpop-relword{display:flex;gap:6px;font-size:12px;align-items:center}
.wpop-relword-word{color:var(--primary);cursor:pointer;font-weight:500}
.wpop-relword-tran{color:var(--text-3)}
.wpop-example{padding:6px 0;border-top:1px dashed var(--border-l)}
.wpop-ex-en{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);font-family:var(--serif)}
.wpop-ex-say{background:none;border:none;cursor:pointer;font-size:14px;color:var(--primary);padding:2px}
.wpop-ex-zh{font-size:12px;color:var(--text-2);margin-left:20px;margin-top:2px}
.wpop-actions{display:flex;gap:6px;margin-top:12px;justify-content:center}
.wpop-btn{padding:6px 14px;border:1px solid var(--border);border-radius:var(--r-xs);background:var(--card);font-size:12px;cursor:pointer;color:var(--text-2)}
.wpop-btn:hover{border-color:var(--primary);color:var(--primary)}
.wcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:8px}
.wcard-main{display:flex;align-items:center;gap:8px}
.wcard-word{font-size:16px;font-weight:600;font-family:var(--serif);cursor:pointer;color:var(--primary)}
.wcard-phon{font-size:11px;color:var(--text-3)}
.wcard-zh{font-size:13px;color:var(--text-2);margin:4px 0}
.wcard-actions{display:flex;gap:4px;flex-wrap:wrap}
.tv-shows-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.tv-show-card{background:var(--card);border:2px solid var(--border);border-radius:var(--r-sm);padding:12px;text-align:center;cursor:pointer;transition:var(--tr)}
.tv-show-card:hover{border-color:var(--primary)}
.tv-show-card.active{border-color:var(--primary);background:var(--primary-l)}
.tv-show-emoji{font-size:28px;margin-bottom:4px}
.tv-show-name{font-size:13px;font-weight:600}
.tv-show-zh{font-size:11px;color:var(--text-3)}
.tv-show-count{font-size:10px;color:var(--text-3);margin-top:2px}
.tv-expr-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:8px}
.tv-expr-top{margin-bottom:4px}
.tv-expr-tag{font-size:10px;padding:2px 8px;border-radius:8px}
.tv-expr-tag.daily{background:#e0f2f1;color:#00695c}
.tv-expr-tag.business{background:#e3f2fd;color:#0d47a1}
.tv-expr-en{font-size:15px;font-family:var(--serif);color:var(--text);margin:4px 0}
.tv-expr-zh{font-size:13px;color:var(--text-2)}
.tv-expr-ctx{font-size:11px;color:var(--text-3);margin-top:4px}
.tv-expr-actions{display:flex;gap:4px;margin-top:8px}
.tv-filter{display:flex;gap:6px;margin-bottom:10px}
.tv-filter-btn{padding:4px 10px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:12px;cursor:pointer;color:var(--text-2)}
.tv-filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== Shopee Module ===== */
.sp-product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sp-prod-stats{font-size:13px;color:var(--text-2);margin:0 0 10px;padding:9px 14px;background:var(--primary-l);border-radius:12px;font-weight:500}
.sp-tb-img{width:44px;height:44px;object-fit:cover;border-radius:8px;display:block}
.sp-tb-img.ph{background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-3)}
.sp-tb-title-wrap{display:flex;align-items:center;gap:4px;max-width:260px}
.sp-tb-title{font-weight:600;font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sp-tb-sub{font-size:11px;color:var(--text-3)}
/* V34：产品行 SKU 列内的产品级折扣输入（全 SKU 统一） */
.sp-prod-tbl .col-sku{min-width:96px}
.sp-tb-skunum{font-weight:700;color:var(--primary)}
.sp-prod-disc{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:11px;color:var(--text-2)}
.sp-prod-disc-item{display:flex;align-items:center;gap:4px;white-space:nowrap;width:100%;padding:3px 6px;border-radius:7px;background:var(--bg);border:1px dashed var(--border);transition:all .15s ease;cursor:pointer}
.sp-prod-disc-item:hover{background:var(--primary-l);border-color:var(--primary);border-style:solid}
.sp-prod-disc-item:hover .sp-disc-label{background:var(--card);color:var(--primary);border-color:var(--primary)}
.sp-disc-label{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;background:var(--bg-2);border:1px solid var(--border-l);border-radius:5px;font-size:12px;color:var(--text-3);font-weight:600;cursor:pointer;transition:all .15s ease}
.sp-disc-prod-in{width:60px;font-size:15px;padding:4px 4px;text-align:center;border:1.5px solid var(--primary);border-radius:6px;background:var(--card);color:var(--text);font-weight:700;cursor:text;transition:all .15s ease}
.sp-disc-prod-in:hover{box-shadow:0 0 0 2px rgba(99,102,241,.18);background:#fff}
.sp-disc-prod-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.22);background:#fff}
.sp-disc-pct{color:var(--text-3);font-size:12px;cursor:pointer;user-select:none;font-weight:600}
.sp-site-days-cell{min-width:150px}
.sp-site-days{display:inline-block;font-size:11px;background:var(--bg);border-radius:6px;padding:1px 5px;margin:1px 2px;color:var(--text-2);white-space:nowrap}
.sp-site-days.isnew{background:var(--primary-l);color:var(--primary);font-weight:600}
.sp-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.sp-badge-on{background:rgba(46,160,67,.12);color:#2ea043}
.sp-badge-off{background:var(--bg);color:var(--text-3)}
.sp-badge-draft{background:rgba(219,171,9,.15);color:#b8860b}
.sp-badge-new{background:rgba(13,115,119,.12);color:var(--primary)}
.sp-badge-old{background:rgba(217,83,79,.12);color:#d9534f}
.sp-badge-na{background:var(--bg);color:var(--text-3)}
.sp-img-upload{display:flex;gap:10px;align-items:flex-start}
.sp-img-preview{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.sp-img-hint{font-size:11px;color:var(--text-3);margin-top:4px}
.sp-site-dates{display:flex;flex-wrap:wrap;gap:8px}
.sp-date-today{font-size:11px;border:1px solid var(--primary);color:var(--primary);background:var(--primary-l);border-radius:10px;padding:0 6px;cursor:pointer;vertical-align:middle}
.sp-date-today:hover{background:var(--primary);color:#fff}
.sku-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--border-l);border-radius:10px;padding:8px;margin-bottom:8px}
.sku-row .input{font-size:12px}
.sku-no-box{font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-l);border-radius:6px;padding:4px 8px;white-space:nowrap}
.sku-no-auto{color:var(--text-3);font-weight:400}
.sp-main-row{cursor:pointer}
.sp-main-row.exp td{background:var(--primary-l)}
.sp-detail-row>td{padding:0!important;background:var(--bg)}
.sp-detail-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 12px}
.sp-detail-row.open .sp-detail-wrap{max-height:1200px;padding:12px}
.sp-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.sp-detail-grid{grid-template-columns:1fr}}
.sp-detail-col{background:var(--card);border:1px solid var(--border-l);border-radius:12px;padding:10px}
.sp-detail-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.sp-detail-line{font-size:12px;color:var(--text-2);padding:3px 0}
.sp-site-cards{display:flex;flex-wrap:wrap;gap:8px}
.sp-site-card{background:var(--bg);border:1px solid var(--border-l);border-radius:10px;padding:8px 10px;min-width:120px}
.sp-site-card.isnew{border-color:var(--primary);background:var(--primary-l)}
.sp-site-card-name{font-size:12px;font-weight:600;color:var(--text)}
.sp-site-card-date{font-size:11px;color:var(--text-3);margin:2px 0}
.sp-site-card-days{font-size:11px;color:var(--text-2)}
.sp-sku-no{font-weight:700;color:var(--primary);white-space:nowrap}
.sp-sku-toggle{background:var(--bg);border:1px solid var(--border-l);border-radius:6px;color:var(--primary);cursor:pointer;width:24px;height:24px;font-size:11px;line-height:1;transition:var(--tr);flex:0 0 auto}
.sp-sku-toggle:hover{border-color:var(--primary);background:var(--primary-l)}
.sp-sku-toggle.open{background:var(--primary);color:#fff;border-color:var(--primary)}
/* V29：SKU 卡片式列表 */
.sp-sku-cards{display:flex;flex-direction:column;gap:10px}
/* V31：优惠券满减条（按平台全局，产品行左侧） */
.sp-sku-cpn-bar{display:flex;flex-direction:column;gap:6px;padding:7px 10px;margin-bottom:8px;background:linear-gradient(135deg,rgba(249,115,22,.08),rgba(236,72,153,.06));border:1px dashed var(--border);border-radius:10px;font-size:12px;color:var(--text-2)}
.sp-cpn-title{display:flex;align-items:center;gap:4px;font-weight:500;color:var(--text-2)}
.sp-cpn-chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sp-sku-cpn-bar.none{flex-direction:row;align-items:center;background:var(--bg);color:var(--text-3)}
.sp-sku-cpn-site{background:var(--card);border:1px solid var(--border-l);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--text-2);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sp-sku-card{background:var(--card);border:1px solid var(--border-l);border-radius:12px;padding:10px 12px;transition:var(--tr)}
.sp-sku-card.open{border-color:var(--primary);box-shadow:0 3px 12px rgba(99,102,241,.08)}
.sp-sku-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px dashed var(--border-l);margin-bottom:8px}
.sp-sku-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.sp-sku-tag{background:var(--bg);border:1px solid var(--border-l);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--text-2);white-space:nowrap}
.sp-sku-orders{font-size:11px;color:var(--text-2);white-space:nowrap;margin-left:auto}
.sp-sku-orders b{color:var(--primary)}
.sp-sku-card-sites{display:flex;flex-direction:column;gap:5px}
/* V30：每站点一行售价（简洁版） */
.sp-sku-site-line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-l);font-size:13px}
.sp-sku-site-line:last-child{border-bottom:none}
.sp-sku-site-line .site-label{width:52px;flex:0 0 auto;font-weight:700;color:var(--primary);font-size:13px}
.sp-sku-site-line .site-input-wrap{display:flex;align-items:center;gap:4px;color:var(--text-3);font-size:12px;white-space:nowrap}
.sp-sku-site-line input{width:72px;font-size:13px;padding:3px 8px}
.sp-sku-site-line .site-disc-tag{color:var(--text-2);font-size:12px;border-left:1px solid var(--border-l);padding-left:8px;white-space:nowrap}
.sp-sku-site-line .site-disc-tag b{color:var(--primary);font-weight:700}
.sp-sku-site-line .site-result{flex:1;text-align:right;color:var(--text);font-size:13px;white-space:nowrap}
.sp-sku-site-line .site-result .pro{color:var(--success);font-weight:700}

.sp-product-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;transition:var(--tr);cursor:pointer}

.sp-product-name{font-size:14px;font-weight:600;margin-bottom:4px}

/* ===== Personal Module ===== */
.note-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px;margin-bottom:8px;cursor:pointer;transition:var(--tr)}
.note-card:hover{border-color:var(--primary);box-shadow:var(--shadow-md)}
.note-title{font-size:14px;font-weight:600;margin-bottom:4px}
.note-preview{font-size:12px;color:var(--text-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.period-day{text-align:center;padding:8px 4px;border-radius:var(--r-xs);font-size:12px;cursor:pointer;transition:var(--tr);min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center}

.period-day.today{border:2px solid var(--primary)}
.period-day.period{background:var(--danger);color:#fff;font-weight:600}

.period-day .flow-dot{width:6px;height:6px;border-radius:50%;margin-top:2px}
.period-month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.period-month-nav button{background:none;border:1px solid var(--border);border-radius:var(--r-xs);padding:4px 10px;cursor:pointer;font-size:14px;color:var(--text-2)}
.period-month-nav span{font-size:14px;font-weight:600}
.period-stats{display:flex;gap:12px;margin-bottom:12px}
.period-stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r-xs);padding:10px;text-align:center}
.period-stat .val{font-size:18px;font-weight:700;color:var(--primary)}
.period-stat .lbl{font-size:10px;color:var(--text-3)}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal{background:var(--card);border-radius:var(--r);padding:20px;max-width:500px;width:calc(100% - 32px);max-height:80vh;overflow-y:auto;display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);transition:transform .3s;z-index:2001}
.modal.open{display:block;transform:translate(-50%,-50%) scale(1)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-close{flex:none;border:none;background:var(--bg);color:var(--text-2);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;margin-left:auto}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

}

.ds-val{display:block;font-size:22px;font-weight:700;color:var(--primary)}
.ds-label{font-size:12px;color:var(--text-3);margin-top:4px;display:block}
.srs-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;min-height:160px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.srs-card-type{font-size:12px;color:var(--text-3);margin-bottom:8px}
.srs-card-en{font-size:18px;line-height:1.6;margin-bottom:8px}
.srs-card-zh{font-size:14px;color:var(--text-2)}

.srs-rate-btns{display:flex;gap:8px;justify-content:center;margin-top:16px}
.srs-rate-btn{padding:10px 20px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:#fff}
.srs-rate-btn.again{background:#ef4444}.srs-rate-btn.hard{background:#f59e0b}.srs-rate-btn.good{background:#10b981}.srs-rate-btn.easy{background:#3b82f6}
.srs-stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.srs-stat{flex:1;min-width:80px;text-align:center;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.srs-stat-val{font-size:20px;font-weight:700;color:var(--primary)}
.srs-stat-label{font-size:11px;color:var(--text-3)}
.practice-area{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px}
.practice-question{font-size:16px;line-height:1.6;margin-bottom:16px;min-height:48px}
.practice-input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--bg);color:var(--text)}
.practice-input:focus{outline:none;border-color:var(--primary)}
.practice-result{margin-top:12px;padding:12px;border-radius:8px;font-size:14px}
.practice-result.correct{background:#d1fae5;color:#065f46}
.practice-result.wrong{background:#fee2e2;color:#991b1b}
.practice-actions{display:flex;gap:8px;margin-top:12px}
.practice-score{display:flex;gap:16px;justify-content:center;margin-bottom:16px}
.practice-score-item{text-align:center}.practice-score-val{font-size:24px;font-weight:700}.practice-score-label{font-size:12px;color:var(--text-3)}
.fb-blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--primary);text-align:center;margin:0 4px;color:var(--primary);font-weight:500}
.email-cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.email-cat-tab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--card)}
.email-cat-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.email-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.email-card-title{font-size:15px;font-weight:500;margin-bottom:8px}
.email-card-subject{font-size:12px;color:var(--text-3);margin-bottom:8px;font-style:italic}
.email-card-body{font-size:13px;line-height:1.6;white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:8px;margin-bottom:8px}
.email-fields{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.email-field-row{display:flex;align-items:center;gap:6px}
.email-field-label{font-size:12px;color:var(--text-2);min-width:80px}
.email-field-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text)}
.scn-step{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.scn-speaker{font-size:12px;color:var(--text-3);margin-bottom:6px}
.scn-text{font-size:15px;line-height:1.6;margin-bottom:16px}
.scn-options{display:flex;flex-direction:column;gap:8px}
.scn-option{padding:14px 16px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px;transition:all 0.2s;background:var(--bg)}
.scn-option:hover{border-color:var(--primary);background:var(--primary-l)}
.scn-feedback{margin-top:12px;padding:12px;border-radius:8px;font-size:13px;line-height:1.5}
.scn-feedback.good{background:#d1fae5;color:#065f46}
.scn-feedback.bad{background:#fee2e2;color:#991b1b}
.mistake-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px}
.mistake-type{font-size:11px;padding:2px 8px;border-radius:4px;color:#fff;font-weight:500}
.mistake-q{font-size:14px;margin:8px 0 4px}
.mistake-ans{font-size:12px;color:var(--text-3)}
.mistake-ans .wrong{color:#ef4444}.mistake-ans .right{color:#10b981}
.cal-heatmap{display:grid;grid-template-columns:repeat(53,1fr);gap:2px;margin-bottom:16px}
.cal-day{width:100%;aspect-ratio:1;border-radius:2px;background:var(--bg);min-height:10px}
.cal-day.l1{background:#c6e6c5}.cal-day.l2{background:#7bc97b}.cal-day.l3{background:#3ba83b}.cal-day.l4{background:#1a7a1a}
.cal-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-3);justify-content:flex-end}
.cal-legend-box{width:12px;height:12px;border-radius:2px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.ach-card{text-align:center;padding:16px 12px;border-radius:12px;border:1px solid var(--border);background:var(--card)}
.ach-card.locked{opacity:0.4;filter:grayscale(1)}
.ach-card.unlocked{border-color:var(--primary);background:var(--primary-l)}
.ach-emoji{font-size:32px;margin-bottom:8px}
.ach-name{font-size:13px;font-weight:500;margin-bottom:4px}
.ach-desc{font-size:11px;color:var(--text-3)}
.report-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.report-bar-chart{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.report-bar-row{display:flex;align-items:center;gap:8px;font-size:13px}
.report-bar-label{min-width:60px;color:var(--text-2)}
.report-bar-track{flex:1;height:20px;background:var(--bg);border-radius:4px;overflow:hidden}
.report-bar-fill{height:100%;background:var(--primary);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:11px}

/* ==================== V16 UI PRO ==================== */
/* --- 全局质感 --- */
body{-webkit-tap-highlight-color:transparent}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
.local-check-title{font-size:12px;font-weight:600;color:#b45309;margin:2px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--border)}
.card-grammar{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(251,191,36,.07);border:1px dashed rgba(251,191,36,.5)}
.card-grammar-title{font-size:12px;font-weight:600;color:#b45309;margin-bottom:4px}
.card-grammar-mark{font-size:13px;line-height:1.7;color:var(--text-2);margin-bottom:5px;word-break:break-word}
.card-grammar-mark mark{background:rgba(239,68,68,.16);color:#dc2626;border-radius:4px;padding:0 3px;font-weight:600}
.card-grammar-fix{font-size:13px;line-height:1.6;color:#0d7377;background:rgba(13,115,119,.08);border-radius:6px;padding:6px 9px;word-break:break-word}


::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
.content{max-width:1400px;padding:20px 16px 40px}
.module-view{animation:fadeUp .35s cubic-bezier(.22,.8,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* --- 顶栏 --- */
.topbar{height:58px;background:var(--card);backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);box-shadow:0 1px 0 var(--border),0 4px 24px rgba(0,0,0,.04)}
.topbar-title{font-size:17px;letter-spacing:.5px}
.topbar-btn{border-radius:10px}
.topbar-btn:active{transform:scale(.92)}
.user-chip{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;font-size:15px;border:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.user-chip:hover{transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.22);color:#fff}
/* --- 侧栏 --- */
.nav-item{border-radius:10px;margin:1px 10px;padding:8px 12px 8px 38px}
.nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.14)}
[data-theme="dark"] .nav-item.active,[data-theme="midnight"] .nav-item.active{color:var(--bg)}
.nav-item.active::before{display:none}
.nav-group-header{border-radius:10px;margin:0 8px}
.sidebar{background:var(--card)}
.sidebar-header{background:linear-gradient(135deg,var(--primary-l),transparent)}
/* --- 卡片 --- */
.card{border-radius:16px;padding:18px;transition:transform .25s cubic-bezier(.22,.8,.36,1),box-shadow .25s,border-color .25s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--primary)}
.card::after{content:'';position:absolute;top:0;left:16px;right:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--accent) 60%,transparent);opacity:0;transition:opacity .3s}
.card:hover::after{opacity:.45}
/* --- 按钮 --- */
.btn{border-radius:12px;transition:var(--tr)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));box-shadow:0 3px 10px rgba(0,0,0,.15)}
.btn-primary:hover{background:linear-gradient(135deg,var(--primary),var(--primary-d));transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,.2)}
.btn-primary:active{transform:translateY(0) scale(.98)}
.btn-ghost:hover,.act-btn:hover{transform:translateY(-1px)}
.act-btn{border-radius:10px}
/* --- 标签 --- */
.tab{border-radius:12px;padding:7px 14px;font-weight:500}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-d));box-shadow:0 3px 10px rgba(0,0,0,.15)}
/* --- 区块标题 --- */
.section-title{position:relative;padding-left:12px}
.section-title::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--accent))}
/* --- 句子卡 --- */
.card-en{font-size:17px;line-height:1.65}
.stat-item strong{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* --- 登录门 --- */
.auth-mask{position:fixed;inset:0;background:rgba(15,15,20,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:10000;opacity:0;pointer-events:none;transition:opacity .35s;padding:20px}
.auth-mask.show{opacity:1;pointer-events:auto}
.auth-card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:32px 28px;box-shadow:0 24px 64px rgba(0,0,0,.3);transform:translateY(24px) scale(.96);transition:transform .35s cubic-bezier(.22,.8,.36,1)}
.auth-mask.show .auth-card{transform:none}
.auth-logo{font-size:44px;text-align:center;animation:bounce 2s ease infinite}
.auth-title{font-size:22px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-top:6px}
.auth-desc{font-size:13px;color:var(--text-3);text-align:center;margin:6px 0 20px}
.auth-tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:18px}
.auth-tab{flex:1;padding:9px;border:none;background:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer;transition:var(--tr);font-family:var(--sans)}
.auth-tab.active{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.auth-label{font-weight:600}
.auth-submit{width:100%;justify-content:center;padding:12px;font-size:15px;margin-top:6px}
.auth-submit:disabled{opacity:.6;cursor:wait}
.auth-guest{text-align:center;font-size:13px;color:var(--text-3);margin-top:16px;cursor:pointer;transition:var(--tr)}
.auth-guest:hover{color:var(--primary)}
/* --- 个人中心 --- */
.uc-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--primary),var(--primary-d) 70%,var(--accent));border-radius:20px;padding:24px 20px;margin-bottom:16px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18);position:relative;overflow:hidden}
.uc-hero::before{content:'';position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.uc-hero.guest{background:linear-gradient(135deg,var(--text-3),var(--text-2))}
.uc-avatar{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.4);position:relative;cursor:pointer}
.uc-avatar-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.uc-avatar-edit{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.uc-hero-info{flex:1}
.uc-name{font-size:20px;font-weight:700}
.uc-sub{font-size:12px;opacity:.85;margin-top:2px}
.uc-badge{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;flex-shrink:0}
.uc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.uc-stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 8px;text-align:center;box-shadow:var(--shadow);transition:var(--tr)}
.uc-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.uc-stat strong{display:block;font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.uc-stat span{font-size:11px;color:var(--text-3)}
.uc-team-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
.uc-team-label{font-size:11px;color:var(--text-3);margin-bottom:2px}
.uc-team-code{font-family:monospace;font-size:15px;font-weight:700;color:var(--primary);word-break:break-all}
.uc-hint{font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:12px}
.uc-btn-row{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:480px){.uc-stats{grid-template-columns:repeat(2,1fr)}.uc-hero{padding:20px 16px}.content{padding:14px 12px 32px}}

/* ==================== V18 DESIGN REFRESH ==================== */
/* 字体与排版基线 */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.content{max-width:1400px;padding:20px 16px 48px}
@media(max-width:480px){.content{padding:14px 12px 36px}}
h1,h2,h3{letter-spacing:-.01em}

/* 顶栏：更干净 */
.topbar{box-shadow:none;border-bottom:1px solid var(--border-l)}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.topbar-btn{border:none;background:transparent}
.user-chip{background:var(--primary-l);color:var(--primary);border:none;font-weight:700}

/* 侧边栏：更精致的分组与选中态（分组可点击折叠） */
.nav-group-header{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:10px 18px 8px;cursor:pointer;pointer-events:auto;transition:var(--tr);border-radius:10px;margin:2px 8px 0;display:flex;align-items:center;gap:8px;user-select:none}
.nav-group-header:hover{color:var(--primary);background:var(--primary-l)}
.nav-group-header .nav-arrow{display:block;margin-left:auto;font-size:10px;transition:transform .2s}
.nav-group.collapsed .nav-group-header .nav-arrow{transform:rotate(-90deg)}
.nav-group-header .nav-icon{font-size:13px}
.nav-item{padding:8px 14px 8px 40px;font-size:13.5px;border-radius:10px;margin:1px 10px;color:var(--text-2);font-weight:500}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(13,115,119,.25)}
.sidebar{border-right:1px solid var(--border-l)}
.sidebar-header{border-bottom:1px solid var(--border-l)}

/* 卡片：去掉描边噪点，柔和阴影 + 悬浮轻抬 */
.card{border:none;box-shadow:0 1px 2px rgba(24,30,40,.04),0 6px 20px -6px rgba(24,30,40,.08);border-radius:14px;padding:18px 18px 16px;margin-bottom:14px}
.card:hover{transform:none;box-shadow:0 2px 4px rgba(24,30,40,.05),0 10px 28px -8px rgba(24,30,40,.12)}
.section-title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;padding-left:0}
.section-title::before{display:none}

/* 标签/筛选：胶囊化 */
.tabs{gap:8px;flex-wrap:wrap}
.tab{border:none;border-radius:999px;background:var(--bg);padding:7px 15px;font-size:13px;font-weight:500;color:var(--text-2)}
.tab:hover{background:var(--border-l);color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(13,115,119,.22)}
.tabs-wrap{overflow:visible}

/* 按钮：主按钮渐变、幽灵按钮轻量 */
.btn{border-radius:10px;font-weight:600;padding:9px 18px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));box-shadow:0 2px 10px -2px rgba(13,115,119,.4)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--bg);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border-l);color:var(--text)}

/* 表单输入 */
.form-input{border-radius:10px;border:1.5px solid var(--border);background:var(--card);transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,115,119,.12);outline:none}
.form-label{font-size:12px;font-weight:600;color:var(--text-2)}

/* 登录门：更高级 */
.auth-card{border-radius:20px;box-shadow:0 24px 64px -16px rgba(10,40,45,.35)}
.auth-submit{width:100%;padding:12px;font-size:15px;letter-spacing:.2em}
.auth-guest-link{font-size:13px;padding:10px}

/* 列表/句子条目节奏 */
.word{border-radius:3px;padding:0 1px;transition:background .15s}
.word:hover{background:var(--primary-l)}

/* 弹窗细节 */
.wpop-close{width:34px;height:34px;font-size:16px}
.toast{border-radius:12px;font-weight:500;box-shadow:0 10px 30px -6px rgba(10,40,45,.3)}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::-webkit-scrollbar-track{background:transparent}
/* ===== V45 句子分类侧边栏 / 长输入 / emoji 选择器 ===== */
.en-layout{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
.cat-sidebar{width:188px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;max-height:calc(100vh - 140px);overflow-y:auto}
.cat-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:var(--r-xs);cursor:pointer;font-size:13px;color:var(--text-2);user-select:none;transition:background var(--tr)}
.cat-item:hover{background:var(--primary-l)}
.cat-item.active{background:var(--primary);color:#fff;font-weight:600}
.cat-item.child{margin-left:16px;font-size:12px}
.cat-item.dragging{opacity:.45}
.cat-emoji{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.cat-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-count{font-size:11px;opacity:.75;background:rgba(0,0,0,.06);border-radius:9px;padding:0 6px;flex-shrink:0}
.cat-item.active .cat-count{background:rgba(255,255,255,.22)}
.cat-actions{display:none;gap:2px;flex-shrink:0}
.cat-item:hover .cat-actions{display:flex}

// 放在 <head> 极早期，不依赖任何全局变量/函数
(function(){
  function forceHide(){
    try{
      var ls=document.getElementById('loadingScreen');
      if(ls){ls.style.display='none';}
    }catch(e){}
  }
  setTimeout(forceHide,3000);
  setTimeout(forceHide,5000);
  // 全局捕获未处理的 promise rejection
  window.addEventListener('unhandledrejection',function(ev){
    try{
      forceHide();
      var d=document.createElement('div');
      d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee;color:#c00;font:13px monospace;padding:16px;white-space:pre-wrap;word-break:break-all';
      d.textContent='Unhandled Promise Rejection: '+(ev.reason&&ev.reason.message?ev.reason.message:String(ev.reason));

    }catch(e){}
  });
})();

function sanitizePattern(p,en){if(!p)return null;if(typeof p==='string'){if(p==='该句为常用表达'||!p.trim())return null;return {explain:p};}if(p.explain==='该句为常用表达')return null;var s=String(en||'').trim().toLowerCase();var stripP=function(x){return String(x||'').toLowerCase().replace(/[\s.!?,;:]+$/g,'').replace(/\s+/g,' ');};var sp=stripP(s);var nat=p.native&&(String(p.native).trim().toLowerCase()===s||stripP(p.native)===sp)?'':(p.native||'');var vs=(p.variations||[]).map(function(v){return typeof v==='string'?{en:v,zh:''}:v;}).filter(function(v){var t=String(v.en||'').trim();return t&&stripP(t)!==sp&&stripP(t)!==s;}).slice(0,3);if(!nat&&vs.length){nat=vs[0].en;vs=vs.slice(1);}if(nat)vs=vs.filter(function(v){return stripP(v.en)!==stripP(nat);});return {explain:p.explain||'',native:nat,variations:vs,extensions:p.extensions||''};}
function _sw(t,re,to){return t.replace(re,function(m){var r=to;if(/^[A-Z]/.test(m))r=r.charAt(0).toUpperCase()+r.slice(1);return r;});}
function makeSynSwap(t){t=_sw(t,/\bthank you very much\b/gi,'thanks a lot');t=_sw(t,/\bthank you\b/gi,'thanks');t=_sw(t,/\bbig\b/gi,'large');t=_sw(t,/\bhelp\b/gi,'assist');t=_sw(t,/\bbegin\b/gi,'start');t=_sw(t,/\bbuy\b/gi,'purchase');t=_sw(t,/\bfast\b/gi,'quick');t=_sw(t,/\btell me\b/gi,'let me know');t=_sw(t,/\bproblem\b/gi,'issue');t=_sw(t,/\banswer\b/gi,'reply');t=_sw(t,/\bneed\b/gi,'require');t=_sw(t,/\bshow\b/gi,'share');t=_sw(t,/\bpackage\b/gi,'parcel');t=_sw(t,/\bshipping\b/gi,'delivery');t=_sw(t,/\breceive\b/gi,'get');t=_sw(t,/\bcheck\b/gi,'verify');t=_sw(t,/^sorry\b/i,'apologies');return t;}
function genVariants(en,zh){var s=String(en||'').trim();var set=[];function add(t){if(!t)return;t=String(t).trim();if(!t)return;var norm=function(x){return String(x).toLowerCase().replace(/[\s.!?,;:]+$/g,'').replace(/\s+/g,' ');};var tn=norm(t),sn=norm(s);if(!tn||tn===sn)return;if(set.some(function(x){return norm(x)===tn;}))return;set.push(t);}var lower=s.charAt(0).toLowerCase()+s.slice(1);add(makeFormal(s));add(makeSynSwap(s));add(makeCasual(s));add(makeFriendly(s));add(makeConcise(s));return set.slice(0,4);}

function openEmojiPicker(cb){showModal('😊 选择图标','<div class="emoji-grid">'+EMOJI_LIST.map(function(e){return '<button type="button" class="emoji-opt" data-e="'+e+'">'+e+'</button>';}).join('')+'</div>');document.querySelectorAll('.emoji-opt').forEach(function(b){b.addEventListener('click',function(){var e=b.dataset.e;closeModal();cb(e);});});}
function renderCatParentSelect(sel,cur){if(!sel)return;var all=getAllCats().filter(function(c){return c.id!=='all'&&c.id!==cur;});var opts='<option value="">无（作为顶级分类）</option>'+all.map(function(c){return '<option value="'+c.id+'"'+(cur===c.id?' selected':'')+'>'+escapeHtml(getCatName(c))+'</option>';}).join('');sel.innerHTML=opts;}
function saveCatEdit(id){var ni=document.getElementById('catEditName');if(!ni)return;var name=ni.value.trim();if(!name){showToast('请输入分类名称');return;}catNames[id]=name;var c=getCatById(id);if(c&&!CATEGORIES.some(function(x){return x.id===id;})){var eb=document.getElementById('catEditEmojiBtn');if(eb)c.emoji=eb.dataset.emoji||eb.textContent;var pi=document.getElementById('catEditParent');if(pi)c.parent=pi.value||'';}saveData(SK.catNames,catNames);saveData(SK.customCats,customCats);closeModal();renderTabs();renderCatSelect();renderSentenceCards();showToast('已保存');}
function openCatEditModal(id){var c=getCatById(id);if(!c)return;var isBuiltin=CATEGORIES.some(function(x){return x.id===id;});var curName=catNames[id]||c.name;var html='<div style="padding:4px 0"><label style="font-size:12px;color:var(--text-3)">分类名称</label><input class="input" id="catEditName" value="'+escapeAttr(curName)+'" style="margin-top:6px;width:100%"></div>';if(!isBuiltin){html+='<div style="padding:10px 0 0"><label style="font-size:12px;color:var(--text-3)">图标</label><div style="display:flex;gap:8px;margin-top:6px;align-items:center"><button type="button" class="cat-emoji-btn" id="catEditEmojiBtn">'+(c.emoji||'📌')+'</button><span style="font-size:12px;color:var(--text-3)">点击更换</span></div></div>';html+='<div style="padding:10px 0 0"><label style="font-size:12px;color:var(--text-3)">上级分类（设为小分类）</label><select class="input" id="catEditParent" style="margin-top:6px;width:100%"></select></div>';}html+='<div style="padding:14px 0 0;display:flex;gap:8px"><button class="btn btn-primary" id="catEditSave" style="flex:1">保存</button>'+(isBuiltin?'':'<button class="btn btn-danger" id="catEditDel">删除</button>')+'</div>';showModal('✏️ 编辑分类',html);document.getElementById('catEditSave').addEventListener('click',function(){saveCatEdit(id);});if(!isBuiltin){renderCatParentSelect(document.getElementById('catEditParent'),c.parent);var eb=document.getElementById('catEditEmojiBtn');eb.addEventListener('click',function(){openEmojiPicker(function(e){eb.textContent=e;eb.dataset.emoji=e;});});document.getElementById('catEditDel').addEventListener('click',function(){deleteCat(id);});}}
function deleteCat(id){if(!confirm('确定删除该分类？相关句子会移到「日常闲聊」'))return;customCats=customCats.filter(function(c){return c.id!==id;});catOrder=catOrder.filter(function(x){return x!==id;});for(var k in sentCatOv){if(sentCatOv[k]===id)delete sentCatOv[k];}userSentences.forEach(function(s){if(s.cat===id)s.cat='casual';});saveData(SK.customCats,customCats);saveData(SK.catOrder,catOrder);saveData(SK.sentCatOv,sentCatOv);saveData(SK.sentences,userSentences);if(currentCat===id)currentCat='all';renderTabs();renderCatSelect();renderSentenceCards();showToast('已删除');}
function openMoveSentence(id){var cats=getAllCats().filter(function(c){return c.id!=='all';});var html='<div class="cat-move-list">'+cats.map(function(c){var pre=c.parent?'<span class="cat-move-child">↳ </span>':'';return '<div class="cat-move-opt" onclick="moveSentenceTo(\''+id+'\',\''+c.id+'\')">'+pre+'<span>'+c.emoji+'</span> '+escapeHtml(getCatName(c))+'</div>';}).join('')+'</div>';showModal('🗂 移动到分类',html);}
function moveSentenceTo(id,cat){var s=allSentences.find(function(x){return x.id===id;});if(!s)return;if(s.isDefault){sentCatOv[id]=cat;saveData(SK.sentCatOv,sentCatOv);}else{var ui=userSentences.findIndex(function(x){return x.id===id;});if(ui>-1){userSentences[ui]=Object.assign({},userSentences[ui],{cat:cat});saveData(SK.sentences,userSentences);rebuildAllSentences();applyCustomOrder();}}closeModal();renderTabs();renderCatSelect();renderSentenceCards();showToast('已移动');}
function moveCat(btn,dir){var id=btn.dataset.id;var tops=[];document.querySelectorAll('#catSidebar .cat-item[data-level="top"]').forEach(function(el){tops.push(el.dataset.id);});var i=tops.indexOf(id);var j=i+dir;if(i<0||j<0||j>=tops.length)return;tops.splice(i,1);tops.splice(j,0,id);catOrder=tops.filter(function(x){return x!=='all';});saveData(SK.catOrder,catOrder);renderTabs();renderCatSelect();}
function moveChildCat(btn,dir){var id=btn.dataset.id;var p=btn.dataset.parent;var kids=customCats.filter(function(c){return c.parent===p;});var ids=kids.map(function(c){return c.id;});var i=ids.indexOf(id);var j=i+dir;if(i<0||j<0||j>=ids.length)return;ids.splice(i,1);ids.splice(j,0,id);customCats.sort(function(a,b){var ai=ids.indexOf(a.id);var bi=ids.indexOf(b.id);if(ai===-1)ai=999;if(bi===-1)bi=999;return ai-bi;});saveData(SK.customCats,customCats);renderTabs();renderCatSelect();}
function moveChildTo(did,parent,tid){var kids=customCats.filter(function(c){return c.parent===parent;});var ids=kids.map(function(c){return c.id;});var di=ids.indexOf(did);if(di<0)return;ids.splice(di,1);var ti=ids.indexOf(tid);if(ti<0)ti=ids.length-1;ids.splice(ti+1,0,did);customCats.sort(function(a,b){var ai=ids.indexOf(a.id);var bi=ids.indexOf(b.id);if(ai===-1)ai=999;if(bi===-1)bi=999;return ai-bi;});saveData(SK.customCats,customCats);}

function initTTS(){if('speechSynthesis' in window){ttsVoices=speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',function(){ttsVoices=speechSynthesis.getVoices();});setTimeout(function(){ttsVoices=speechSynthesis.getVoices();},500);}}
function speakText(text){if(!text)return;var eng=ttsEngine;if(eng==='auto'){if('speechSynthesis' in window){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=ttsRate;var ev=ttsVoices.find(function(v){return v.lang&&v.lang.indexOf('en-US')>-1&&v.localService;})||ttsVoices.find(function(v){return v.lang&&v.lang.indexOf('en')>-1;});if(ev)u.voice=ev;speechSynthesis.speak(u);return;}catch(e){}}tryYoudaoTTS(text);return;}if(eng==='native'&&'speechSynthesis' in window){try{speechSynthesis.cancel();var u2=new SpeechSynthesisUtterance(text);u2.lang='en-US';u2.rate=ttsRate;speechSynthesis.speak(u2);}catch(e){}return;}if(eng==='youdao'){tryYoudaoTTS(text);return;}}
function tryGoogleTTS(text){try{var t=text.length>200?text.substring(0,200):text;var url='https://translate.google.com/translate_tts?ie=UTF-8&q='+encodeURIComponent(t)+'&tl=en&client=tw-ob';if(ttsAudioEl)ttsAudioEl.pause();ttsAudioEl=new Audio(url);ttsAudioEl.playbackRate=ttsRate;ttsAudioEl.play().catch(function(){});return true;}catch(e){return false;}}
function tryYoudaoTTS(text){try{var t=text.length>300?text.substring(0,300):text;var url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(t)+'&type=2';if(ttsAudioEl)ttsAudioEl.pause();ttsAudioEl=new Audio(url);ttsAudioEl.playbackRate=ttsRate;ttsAudioEl.play().catch(function(){});return true;}catch(e){return false;}}
function speakWord(word){speakText(word.replace(/[^a-zA-Z']/g,''));}
function speakSentence(text){if(!text)return;if('speechSynthesis' in window){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=ttsRate;var ev=ttsVoices.find(function(v){return v.lang&&v.lang.indexOf('en-US')>-1&&v.localService;})||ttsVoices.find(function(v){return v.lang&&v.lang.indexOf('en')>-1;});if(ev)u.voice=ev;speechSynthesis.speak(u);return;}catch(e){}}tryYoudaoTTS(text);}
function speakWordAccent(word,type){try{var url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type='+type;if(ttsAudioEl)ttsAudioEl.pause();ttsAudioEl=new Audio(url);ttsAudioEl.play().catch(function(){});return true;}catch(e){return false;}}

function rebuildAllSentences(){allSentences=[].concat(DEFAULT_SENTENCES.map(function(s,i){return Object.assign({},s,{id:'d'+i,isDefault:true});})).concat(userSentences.map(function(s){return Object.assign({},s,{isDefault:false});}));allSentences.forEach(function(s){if(!s.level)s.level=estimateLevel(s.en);});}
