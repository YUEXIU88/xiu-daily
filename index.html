function renderCardHTML(s,serialNum){var ec=effCat(s);var cat=getCatById(ec)||{};var isFav=favorites.includes(s.id);var ms=window._enMulti&&!s.isDefault;var sel=!!(window._enSelSet&&window._enSelSet[s.id]);var msCls=(ms&&sel?' ms-selected':'');var msAttr=(ms?' onclick="cardMsClick(\''+s.id+'\',event)"':'');var h='<div class="card'+msCls+'" data-id="'+s.id+'"'+msAttr+'><div class="card-top">'+(ms?'<span class="ms-check'+(sel?' on':'')+'">'+(sel?'✓':'')+'</span>':'')+'<span class="card-serial">#'+serialNum+'</span><div class="card-tags"><span class="card-tag" style="background:'+(cat.color||'#6b7280')+'1a;color:'+(cat.color||'#6b7280')+'">'+(cat.emoji||'\ud83d\udccc')+' '+(getCatName(cat)||ec)+'</span><span class="card-tag" style="background:'+(s.isDefault?'var(--primary-l)':'var(--accent-l)')+';color:'+(s.isDefault?'var(--primary)':'var(--accent)')+'">'+(s.isDefault?'\u7cfb\u7edf':'\u6211\u7684')+'</span>'+(s.level?'<span class=\"card-tag lv-'+s.level+'\">'+s.level+'</span>':'')+'</div></div>';h+='<div class="card-en">'+renderWords(s.en)+'</div><div class="card-zh">'+escapeHtml(s.zh)+'</div><div class="card-actions"><button class="act-btn" onclick="speakSentence(\''+escapeAttrM(s.en)+'\')">\ud83d\udd0a</button><button class="act-btn" onclick="copyText(\''+escapeAttrM(s.en)+'\')">\ud83d\udccb</button><button class=\"act-btn\" onclick=\"openMoveSentence(\''+s.id+'\')\">\ud83d\udcc2</button><button class="act-btn '+(isFav?'fav-active':'')+'" onclick="toggleFav(\''+s.id+'\')">'+(isFav?'\u2b50':'\u2606')+'</button>';if(!s.isDefault){h+='<button class="act-btn" onclick="editSentence(\''+s.id+'\')">\u270f\ufe0f</button>';h+='<button class="act-btn danger" onclick="deleteSentence(\''+s.id+'\')">\ud83d\uddd1\ufe0f</button>';}h+='</div>';var pat=sanitizePattern(s.pattern,s.en);if(!pat&&!s.isDefault)pat=sanitizePattern(generatePattern(s.en,s.zh),s.en);if(pat){var p=pat;h+='<div class="pattern-section expanded"><div class="pattern-toggle" onclick="this.parentElement.classList.toggle(\'expanded\')">\ud83d\udca1 \u53e5\u5f0f\u8bb2\u89e3</div><div class="pattern-content">';if(p.explain)h+='<div class="pat-block pat-explain">\ud83d\udcd6 '+escapeHtml(p.explain)+'</div>';if(p.native)h+='<div class="pat-block pat-native">\u2b50 \u66f4\u5730\u9053\uff1a'+escapeHtml(p.native)+'</div>';if(p.variations&&p.variations.length>0){h+='<div class="pat-block pat-variations">\ud83d\udd04 \u4e3e\u4e00\u53cd\u4e09\uff1a';p.variations.forEach(function(v){var ven=typeof v==='string'?v:(v&&v.en?v.en:'');var vzh=typeof v==='string'?'':(v&&v.zh?v.zh:'');h+='<div class="pat-variation-item"><div class="pv-en">\u2022 '+renderWords(ven)+' <button class="pv-say-btn" onclick="speakSentence(\''+escapeAttr(ven)+'\')">\ud83d\udd0a</button><button class="pv-say-btn" onclick="copyText(\''+escapeAttr(ven)+'\')">\ud83d\udccb</button></div>'+(vzh?'<div class="pv-zh">'+escapeHtml(vzh)+'</div>':'')+'</div>';});h+='</div>';}if(p.extensions)h+='<div class="pat-block pat-extensions">\ud83d\udcce '+escapeHtml(p.extensions)+'</div>';if(!s.isDefault){var _ga=analyzeSentenceLocal(s.en);if(_ga&&_ga.issues&&_ga.issues.length){h+='<div class="card-grammar"><div class="card-grammar-title">🔍 语法检查（'+_ga.issues.length+' 处）</div><div class="card-grammar-mark">'+markIssues(s.en,_ga.issues)+'</div><div class="card-grammar-fix">✅ 正确写法：'+escapeHtml(_ga.corrected)+'</div></div>';}}h+='</div></div>';}h+='</div>';return h;}
var LEVEL_WORDS_B1=['negotiate','negotiation','invoice','shipment','logistics','warehouse','refund','discount','catalog','quotation','supplier','customs','delivery','payment','sample','available','confirm','arrange','forward','urgent','appreciate','regarding','previous','additional','immediately','recommend','separately','procedure','document','responsibility','approximate','guarantee','requirement','professional','convenient','efficient','flexible','specific','especially','basically','actually','however','therefore','moreover','although','whether','unless','despite','according','depending','consider','establish','maintain','specialize','corresponding','informed','expedited','consolidate','discrepancy','penalty','remittance','settlement','escalate','facilitate','prioritize','coordinate','substitute','terminate','comprehensive','substantial','favorable','unfavorable','proceed','provision','compliance','eligible','mandatory','subsequent','preliminary','definitely','obviously','certainly','probably','rarely','frequently','gradually','suddenly','extremely','particularly','generally','eventually','successfully','currently','recently','previously','necessary','possible','important','different','available','difficult','excellent','wonderful','beautiful','comfortable','reasonable','affordable','incredible','outstanding'];
function estimateLevel(en){var s=String(en||'').trim();if(!s)return 'A2';var words=s.toLowerCase().replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(Boolean);var n=words.length;if(n===0)return 'A2';var longWords=words.filter(function(w){return w.replace(/[^a-z]/g,'').length>=9;}).length;var b1=words.filter(function(w){return LEVEL_WORDS_B1.indexOf(w.replace(/[^a-z]/g,''))>=0;}).length;var clauses=(s.match(/[,;:]| and | but | or | because | if | that | which | when | where /gi)||[]).length;var score=0;if(n>=18)score+=3;else if(n>=12)score+=2;else if(n>=8)score+=1;if(longWords>=1)score+=2;if(longWords>=2)score+=1;if(b1>=1)score+=2;if(b1>=2)score+=1;if(clauses>=2)score+=2;else if(clauses>=1)score+=1;if(score>=5)return 'B1';if(score>=2)return 'A2';return 'A1';}
function getFilteredSentences(){var f=allSentences.slice();if(currentCat!=='all'){var desc=catDescendants(currentCat);f=f.filter(function(s){return desc.indexOf(effCat(s))!==-1;});}if(levelFilter!=='all'){f=f.filter(function(s){return (s.level||estimateLevel(s.en))===levelFilter;});}if(searchQuery){var q=searchQuery.toLowerCase();f=f.filter(function(s){return s.en.toLowerCase().indexOf(q)!==-1||s.zh.toLowerCase().indexOf(q)!==-1;});}if(userLevel&&userLevel!=='all'){var ul=userLevel;f=f.slice().sort(function(a,b){var la=(a.level||estimateLevel(a.en))===ul?0:1;var lb=(b.level||estimateLevel(b.en))===ul?0:1;return la-lb;});}return f;}
function renderSentenceCards(){var filtered=getFilteredSentences();var serialMap={};allSentences.forEach(function(s){var k=effCat(s);if(!serialMap[k])serialMap[k]=0;serialMap[k]++;s._serial=serialMap[k];});if(customOrder.length>0){var om={};customOrder.forEach(function(id,i){om[id]=i;});filtered.sort(function(a,b){var ai=om[a.id]!==undefined?om[a.id]:999999;var bi=om[b.id]!==undefined?om[b.id]:999999;return ai-bi;});}var el=document.getElementById('enCards');if(!el)return;if(filtered.length===0){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">\ud83d\udcdd</div><p>\u6ca1\u6709\u627e\u5230\u53e5\u5b50</p></div>';return;}var show=filtered.slice(currentPage*pageSize,(currentPage+1)*pageSize);var html=show.map(function(s){return renderCardHTML(s,s._serial);}).join('');if(window._enMulti){var uTotal=filtered.filter(function(sx){return !sx.isDefault;}).length;var selN=Object.keys(window._enSelSet||{}).filter(function(k){return window._enSelSet[k];}).length;html='<div class="ms-bar"><span class="ms-count">已选 <b>'+selN+'</b> / 可删 '+uTotal+' 句</span><button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="msSelectAll()">☑ 全选</button><button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="msClearSel()">○ 清除勾选</button><button class="btn btn-ghost" style="font-size:12px;padding:5px 10px;background:var(--danger);color:#fff;border-color:var(--danger)" onclick="deleteSelectedSentences()">🗑 删除所选('+selN+')</button></div>'+html;}if((currentPage+1)*pageSize<filtered.length){html+='<div style="text-align:center;padding:12px"><button class="btn btn-ghost" onclick="loadMoreCards()">\u52a0\u8f7d\u66f4\u591a ('+((currentPage+1)*pageSize)+'/'+filtered.length+')</button></div>';}el.innerHTML=html;}

function renderTabs(){var el=document.getElementById('catSidebar');if(!el)return;var cats=getAllCats();var tops=cats.filter(function(c){return !c.parent;});var kids=cats.filter(function(c){return c.parent;});var om={};(catOrder||[]).forEach(function(id,i){om[id]=i;});tops=tops.map(function(c,i){return {c:c,i:i};}).sort(function(a,b){if(a.c.id==='all')return -1;if(b.c.id==='all')return 1;var ai=om[a.c.id]!==undefined?om[a.c.id]:999999;var bi=om[b.c.id]!==undefined?om[b.c.id]:999999;return ai-bi||(a.i-b.i);}).map(function(x){return x.c;});var html=tops.map(function(cat){return catItemHtml(cat,false);}).join('')+kids.map(function(cat){return catItemHtml(cat,true);}).join('')+'<button class="cat-add-btn" id="catAddBtn">＋ 新建分类</button>';el.innerHTML=html;el.querySelectorAll('.cat-item').forEach(function(it){it.addEventListener('click',function(e){if(e.target.closest('.cat-act'))return;currentCat=it.dataset.id;currentPage=0;renderTabs();renderSentenceCards();});it.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',it.dataset.id);it.classList.add('dragging');});it.addEventListener('dragover',function(e){e.preventDefault();});it.addEventListener('drop',function(e){e.preventDefault();var did=e.dataTransfer.getData('text/plain');var tid=it.dataset.id;if(did&&tid&&did!==tid){if(it.dataset.level==='top'){var rows=Array.prototype.slice.call(document.querySelectorAll('#catSidebar .cat-item[data-level="top"]'));var ids=rows.map(function(r){return r.dataset.id;});var di=ids.indexOf(did);if(di<0)return;ids.splice(di,1);var ti=ids.indexOf(tid);if(ti<0)ti=ids.length-1;ids.splice(ti+1,0,did);catOrder=ids.filter(function(x){return x!=='all';});saveData(SK.catOrder,catOrder);}else{moveChildTo(did,it.dataset.parent,tid);}renderTabs();renderCatSelect();}});it.addEventListener('dragend',function(){it.classList.remove('dragging');});});var ab=document.getElementById('catAddBtn');if(ab)ab.addEventListener('click',function(){switchEnMode('manual');var p=document.getElementById('enAddPanel');if(p)p.classList.add('open');var sel=document.getElementById('catSelect');if(sel){sel.value='__custom__';onCatSelectChange();}});}
function catItemHtml(cat,isChild){var count=cat.id==='all'?allSentences.length:catCount(cat.id);var active=cat.id===currentCat;var name=escapeHtml(getCatName(cat));var emoji=cat.emoji||'📌';var updn=isChild?'<button class="cat-act" data-id="'+cat.id+'" data-parent="'+(cat.parent||'')+'" onclick="moveChildCat(this,-1)">▲</button><button class="cat-act" data-id="'+cat.id+'" data-parent="'+(cat.parent||'')+'" onclick="moveChildCat(this,1)">▼</button>':'<button class="cat-act" data-id="'+cat.id+'" onclick="moveCat(this,-1)">▲</button><button class="cat-act" data-id="'+cat.id+'" onclick="moveCat(this,1)">▼</button>'+((cat.id==='all')?'':'<button class="cat-act" data-id="'+cat.id+'" title="新建小分类" onclick="openNewSubCat(\''+cat.id+'\')">＋</button>');return '<div class="cat-item '+(active?'active':'')+(isChild?' child':'')+'" data-id="'+cat.id+'" data-level="'+(isChild?'child':'top')+'" draggable="true"><span class="cat-emoji">'+emoji+'</span><span class="cat-name">'+name+'</span><span class="cat-count">'+count+'</span><span class="cat-actions">'+updn+'<button class="cat-act" data-id="'+cat.id+'" onclick="openCatEditModal(\''+cat.id+'\')">✏️</button></span></div>';}

async function translateEnToZh(text){var urls=['https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh&dt=t&q=','https://translate.google.cn/translate_a/single?client=gtx&sl=en&tl=zh&dt=t&q='];var done=false;var t=await new Promise(function(res){var left=urls.length;urls.forEach(function(u){fetchT(u+encodeURIComponent(text),{},4500).then(function(r){return r.ok?r.json():Promise.reject(new Error('bad'));}).then(function(d){if(done)return;done=true;var st=(d&&d[0]&&d[0].map)?d[0].map(function(x){return x&&x[0]?x[0]:'';}).join(''):'';res(st);}).catch(function(){left--;if(left===0&&!done){done=true;res('');}});});setTimeout(function(){if(!done){done=true;res('');}},5000);});if(t)return t;try{var r2=await fetchT('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-CN',{},6000);var d2=await r2.json();return d2&&d2.responseData?d2.responseData.translatedText:'';}catch(e){return '';}}
async function translateZhToEn(text){try{var r=await fetchT('https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh&tl=en&dt=t&q='+encodeURIComponent(text),{},4500);var d=await r.json();return d[0].map(function(i){return i[0];}).join('');}catch(e){var r2=await fetchT('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh|en',{},6000);var d2=await r2.json();return d2.responseData.translatedText;}}
async function generateSentences(){var inp=document.getElementById('genInput').value.trim();if(!inp){showToast('\u8bf7\u8f93\u5165\u4e2d\u6587\u63cf\u8ff0');return;}var btn=document.getElementById('genBtn');var res=document.getElementById('genResults');btn.disabled=true;res.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3)">\u6b63\u5728\u751f\u6210\u2026</div>';var sugs=[];for(var i=0;i<GEN_TEMPLATES.length;i++){var g=GEN_TEMPLATES[i];if(g.keywords.some(function(kw){return inp.includes(kw);})){for(var j=0;j<g.templates.length;j++){var t=g.templates[j];if(!sugs.some(function(s){return s.en===t.en;}))sugs.push(Object.assign({},t,{cat:g.cat}));}}}try{var tr=await translateZhToEn(inp);if(tr&&!sugs.some(function(s){return s.en.toLowerCase()===tr.toLowerCase();}))sugs.push({en:tr,zh:inp,cat:'casual'});}catch(e){}btn.disabled=false;if(sugs.length===0){res.innerHTML='<div class="empty-state"><p>\u6ca1\u6709\u5339\u914d\u7684\u53e5\u5b50</p></div>';return;}res.innerHTML=sugs.map(function(s,i){var cat=getCatById(s.cat)||getAllCats()[0];return '<div class="gen-suggestion" style="animation-delay:'+(i*0.05)+'s"><div class="gen-suggestion-en">'+renderWords(s.en)+'</div><div class="gen-suggestion-zh">'+escapeHtml(s.zh)+'</div><div class="gen-suggestion-actions"><span class="gen-suggestion-tag">'+cat.emoji+' '+cat.name+'</span><button class="act-btn" onclick="speakSentence(\''+escapeAttrM(s.en)+'\')">\ud83d\udd0a</button><button class="act-btn" onclick="copyText(\''+escapeAttrM(s.en)+'\')">\ud83d\udccb</button><button class="gen-suggestion-use" data-en="'+escapeAttr(s.en)+'" data-zh="'+escapeAttr(s.zh)+'" data-cat="'+s.cat+'">\u4f7f\u7528 \u2192</button></div></div>';}).join('');res.querySelectorAll('.gen-suggestion-use').forEach(function(b){b.addEventListener('click',function(){useGen(b.dataset.en,b.dataset.zh,b.dataset.cat);});});}
function useGen(en,zh,cat){switchEnMode('manual');document.getElementById('enInput').value=en;document.getElementById('zhInput').value=zh;window._zhUserTyped=true;autoResize(document.getElementById('enInput'));autoResize(document.getElementById('zhInput'));renderCatSelect();if(cat)document.getElementById('catSelect').value=cat;document.getElementById('genInput').value='';document.getElementById('genResults').innerHTML='';checkDuplicates(en);showToast('\u5df2\u586b\u5165');setTimeout(function(){document.getElementById('enInput').focus();},300);}
async function doTranslation(inputText,resultsEl,btnEl){if(!inputText){showToast('\u8bf7\u8f93\u5165\u4e2d\u6587');return;}if(btnEl)btnEl.disabled=true;resultsEl.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-3)">\u6b63\u5728\u7ffb\u8bd1\u2026</div>';var base=await translateZhToEn(inputText);if(!base){resultsEl.innerHTML='<div class="empty-state"><p>\u7ffb\u8bd1\u670d\u52a1\u4e0d\u53ef\u7528</p></div>';if(btnEl)btnEl.disabled=false;return;}var styles=[{label:'\ud83d\udde3\ufe0f \u9053\u5730\u53e3\u8bed',text:makeCasual(base)},{label:'\ud83d\udccb \u6b63\u5f0f\u5546\u52a1',text:makeFormal(base)},{label:'\u2702\ufe0f \u7b80\u6d01\u76f4\u63a5',text:makeConcise(base)},{label:'\ud83d\udcac \u53cb\u597d\u4eb2\u5207',text:makeFriendly(base)}];resultsEl.innerHTML=styles.map(function(s){return '<div class="tr-result-card"><div class="tr-result-style">'+s.label+'</div><div class="tr-result-en">'+renderWords(s.text)+'</div><div class="tr-result-actions"><button class="act-btn" onclick="speakSentence(\''+escapeAttr(s.text)+'\')">\ud83d\udd0a</button><button class="act-btn" onclick="copyText(\''+escapeAttr(s.text)+'\')">\ud83d\udccb</button><button class="act-btn" onclick="saveTranslation(\''+escapeAttr(s.text)+'\',\''+escapeAttr(inputText)+'\')">\u2b50</button></div></div>';}).join('');if(btnEl)btnEl.disabled=false;}
function makeCasual(t){return t.replace(/\bdo not\b/gi,"don't").replace(/\bcannot\b/gi,"can't").replace(/\bI am\b/g,"I'm").replace(/\bit is\b/gi,"it's");}
function makeFormal(t){return t.replace(/\bdon't\b/gi,"do not").replace(/\bcan't\b/gi,"cannot").replace(/\bI'm\b/g,"I am").replace(/\bit's\b/gi,"it is");}
function makeConcise(t){return t.replace(/\bvery\s+/gi,'').replace(/\bjust\s+/gi,'').replace(/\bactually\s+/gi,'');}
function makeFriendly(t){var r=makeCasual(t);if(!/[.!?]$/.test(r))return r+'!';if(!r.endsWith('!'))r=r.replace(/\.$/,'!');return r;}
function saveTranslation(en,zh){var ns={id:genId(),en:en,zh:zh,cat:'casual'};userSentences.push(ns);saveData(SK.sentences,userSentences);scheduleSync();allSentences.push(Object.assign({},ns,{isDefault:false}));customOrder.push(ns.id);saveData(SK.order,customOrder);showToast('\u5df2\u4fdd\u5b58');}

function fmtDate(iso){if(!iso)return '-';var p=String(iso).split(/[-/]/);if(p.length<3)return iso;return p[1]+'/'+p[2];}
function downloadFile(name,content,mime){var blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},1500);}
function exportCSV(name,rows){var csv=rows.map(function(r){return r.map(function(c){if(c===null||c===undefined)c='';c=String(c);if(/[",\n\r]/.test(c))c='"'+c.replace(/"/g,'""')+'"';return c;}).join(',');}).join('\r\n');downloadFile(name,'\ufeff'+csv,'text/csv;charset=utf-8');}
function parseTable(text){text=text.replace(/^\ufeff/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');if(text.indexOf('\t')>=0){return text.split('\n').filter(function(l){return l.trim();}).map(function(l){return l.split('\t');});}var rows=[],row=[],cur='',inq=false;for(var i=0;i<text.length;i++){var ch=text[i];if(inq){if(ch==='"'&&text[i+1]==='"'){cur+='"';i++;}else if(ch==='"'){inq=false;}else cur+=ch;}else{if(ch==='"')inq=true;else if(ch===','){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=ch;}}if(cur!==''||row.length>0){row.push(cur);rows.push(row);}return rows.filter(function(r){return r.some(function(c){return c.trim()!=='';});});}

// ---------- Shopee: Products ----------
function prodSiteDays(p,sid){var d=p&&p.listed&&p.listed[sid];if(!d)return null;var t=Date.now()-new Date(d+'T00:00:00').getTime();return Math.max(0,Math.floor(t/86400000));}
function prodNewOld(p){var days=null;if(p&&p.listed){for(var k in p.listed){if(p.listed[k]){var dd=prodSiteDays(p,k);if(dd!==null&&(days===null||dd<days))days=dd;}}}return days;}
function prodSiteTag(p,sid){var dd=prodSiteDays(p,sid);if(dd===null)return null;return dd<=30?'new':'old';}
function collectAllSkuNos(){var set={};spProducts.forEach(function(p){(p.skus||[]).forEach(function(s){if(s.skuNo)set[s.skuNo]=1;});});return set;}
function genSkuNoFrom(prodName,skuName,qty){var clean=function(s){return(s||'').trim().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'').substring(0,20);};return clean(prodName)+'-'+clean(skuName)+'-'+(parseInt(qty)||1)+'个';}
function checkSkuNoDuplicate(skuNo,excludePid){for(var i=0;i<spProducts.length;i++){var p=spProducts[i];if(p.id===excludePid)continue;for(var j=0;j<(p.skus||[]).length;j++){if((p.skus[j].skuNo||'')===skuNo)return true;}}return false;}
function getSkuOrderStats(skuNo){var qty=0,orders=0,rev=0;spOrders.forEach(function(o){if(o.sku===skuNo){orders++;qty+=(o.qty||1);rev+=(o.revenue||0);}});return{orders:orders,qty:qty,rev:rev};}
function fmtSkuNo(skuNo){return(skuNo||'').replace(/(\d+)x个$/,'$1个');}
function prodSkuCount(p){return (p.skus||[]).length;}
function prodCostSummary(p){var skus=p.skus||[];if(!skus.length)return {min:p.cost||0,max:p.cost||0,avg:p.cost||0};var arr=skus.map(function(s){return parseFloat(s.cost)||0;});return {min:Math.min.apply(null,arr),max:Math.max.apply(null,arr),avg:Math.round(arr.reduce(function(a,b){return a+b;},0)/arr.length*100)/100};}
function prodWeightSummary(p){var skus=p.skus||[];if(!skus.length)return {min:p.weight||0,max:p.weight||0};var arr=skus.map(function(s){return parseFloat(s.weight)||0;});return {min:Math.min.apply(null,arr),max:Math.max.apply(null,arr)};}
function prodStatusBadge(s){if(s==='on')return '<span class="sp-badge sp-badge-on">🟢 上架中</span>';if(s==='off')return '<span class="sp-badge sp-badge-off">⏸ 已下架</span>';return '<span class="sp-badge sp-badge-draft">📝 草稿</span>';}
function renderProductGrid(){

  var q='';var si=$('spProdSearch');if(si)q=si.value.toLowerCase();
  var list=spProducts.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)!==-1||(p.supplier||'').toLowerCase().indexOf(q)!==-1||(p.title||'').toLowerCase().indexOf(q)!==-1||(p.category||'').toLowerCase().indexOf(q)!==-1||(p.skus||[]).some(function(s){return (s.skuNo||'').toLowerCase().indexOf(q)!==-1||(s.name||'').toLowerCase().indexOf(q)!==-1||(s.enName||'').toLowerCase().indexOf(q)!==-1;});});
  var statsEl=$('spProdStats');if(statsEl){var nNew=0,nOld=0,nOn=0,nSku=0;list.forEach(function(p){var d=prodNewOld(p);if(d!==null&&d<=30)nNew++;else if(d!==null&&d>30)nOld++;if(p.status==='on')nOn++;nSku+=(p.skus||[]).length;});statsEl.innerHTML='📦 共 <b>'+list.length+'</b> 个产品 · 🔢 SKU <b>'+nSku+'</b> 个 · 🆕 新品 <b style="color:var(--success)">'+nNew+'</b> · 🏷 老品 <b style="color:var(--danger)">'+nOld+'</b> · 🟢 上架中 <b>'+nOn+'</b>';}
  if(list.length===0){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">📦</div><p>还没有产品</p><p style="font-size:13px;color:var(--text-3)">点击「添加产品」或「批量导入」开始</p></div>';return;}
  var head='<thead><tr><th class="col-idx">#</th><th class="col-img">图片</th><th class="col-title">上架标题 / 产品名</th><th class="col-cat">类目</th><th class="col-sku">SKU</th><th class="col-status">状态</th><th class="col-act">操作</th></tr></thead>';

    return '<tr data-pid="'+p.id+'" class="sp-main-row'+(exp?' exp':'')+'"><td class="num col-idx">'+(idx+1)+'</td><td class="col-img">'+img+'</td><td class="col-title">'+titleWrap+(p.title&&p.title!==p.name?'<div class="sp-tb-sub">'+escapeHtml(p.name)+'</div>':'')+'</td><td class="col-cat">'+(p.category?escapeHtml(p.category):'<span style="color:var(--text-3)">—</span>')+'</td><td class="col-sku"><div class="sp-tb-skunum">'+skuN+'</div>'+prodDiscInputs(p)+'</td><td class="col-status">'+prodStatusBadge(p.status)+'</td><td class="col-act">'+actions+'</td></tr>'+
      '<tr class="sp-detail-row'+(exp?' open':'')+'" data-pid="'+p.id+'"><td colspan="7"><div class="sp-detail-wrap">'+
        '<div class="sp-detail-grid">'+
          '<div class="sp-detail-col"><div class="sp-detail-title">🌏 各站点上架明细</div>'+renderSiteListDetail(p)+'</div>'+
          '<div class="sp-detail-col"><div class="sp-detail-title">💸 成本 / 重量</div>'+prodCostWeightHtml(p)+'</div>'+
        '</div>'+
        '<div class="sp-detail-title" style="margin-top:10px">🔢 SKU 明细（'+skuN+'）</div>'+
        renderSkuDetailTable(p)+
      '</div></td></tr>';
  }).join('')+'</tbody>';
  el.innerHTML=renderCouponBar()+'<div class="table-wrap"><table class="data-table sp-prod-tbl">'+head+body+'</table></div>';
}
// 产品行 SKU 列下的折扣输入（V34）：每启用站点一个，全 SKU 统一
function prodDiscInputs(p){
  var sites=calcSitesEnabled();
  if(!sites.length)return '';
  var ins=sites.map(function(s){
    var v=(p.disc&&p.disc[s.id]!=null&&p.disc[s.id]!=='')?p.disc[s.id]:prodDisc(p,s.id);
    return '<div class="sp-prod-disc-item" title="'+s.name+' 产品统一折扣（该站点全部 SKU）：点击直接输入"><label class="sp-disc-label" onclick="(function(inp){var i=inp||this.parentNode.querySelector(\'.sp-disc-prod-in\');if(i){i.focus();i.select();}}).call(this)">'+s.name.charAt(0)+'</label><input class="sp-disc-prod-in" data-prod-disc="'+s.id+'" type="number" step="0.1" min="0" value="'+v+'" onclick="this.select()" placeholder="折"><span class="sp-disc-pct" onclick="(function(inp){var i=inp||this.parentNode.querySelector(\'.sp-disc-prod-in\');if(i){i.focus();i.select();}}).call(this)">%</span></div>';
  }).join('');
  return '<div class="sp-prod-disc">'+ins+'</div>';
}
function prodCostWeightHtml(p){
  var c=prodCostSummary(p),w=prodWeightSummary(p);
  var h='<div class="sp-detail-line">成本：¥'+fmtNum(c.min)+(c.max!==c.min?' ~ ¥'+fmtNum(c.max):'')+(c.avg?'（均 ¥'+fmtNum(c.avg)+'）':'')+'</div>';
  h+='<div class="sp-detail-line">重量：'+fmtNum(w.min)+'g'+(w.max!==w.min?' ~ '+fmtNum(w.max)+'g':'')+'</div>';
  if(p.shipFrom)h+='<div class="sp-detail-line">📍 发货地：'+escapeHtml(p.shipFrom)+'</div>';
  if(p.supplier)h+='<div class="sp-detail-line">🏭 供应商：'+escapeHtml(p.supplier)+'</div>';
  if(p.link)h+='<div class="sp-detail-line">🔗 <a href="'+escapeAttr(p.link)+'" target="_blank" style="color:var(--primary)">查看链接</a></div>';
  return h;
}
function renderSiteListDetail(p){
  var cells=SHOPEE_SITES.map(function(s){
    var dd=prodSiteDays(p,s.id);
    if(dd===null)return ''; // 未填上架时间不显示
    var tag=dd<=30?'<span class="sp-badge sp-badge-new">🆕 NEW</span>':'<span class="sp-badge sp-badge-old">🏷 OLD</span>';
    return '<div class="sp-site-card'+(dd<=30?' isnew':'')+'"><div class="sp-site-card-name">'+s.name+'</div><div class="sp-site-card-date">上架 '+((p.listed&&p.listed[s.id])||'')+'</div><div class="sp-site-card-days">'+dd+' 天 '+tag+'</div></div>';
  }).join('');
  if(!cells.trim())return '<div class="sp-detail-line" style="color:var(--text-3)">尚未填写任何站点的上架时间</div>';
  return '<div class="sp-site-cards">'+cells+'</div>';
}
// 优惠券满减规则（V31）：按平台在「⚙️ 站点计算配置」统一设置，全产品通用；V32 起显示在产品列表顶部（全局一条）
function renderCouponBar(){
  var sites=calcSitesEnabled().filter(function(s){return parseCouponRules((siteCalc[s.id]||{}).coupon).length>0;});
  if(!sites.length)return '<div class="sp-sku-cpn-bar none"><span class="sp-cpn-icon">🎟️</span> 优惠券：暂无满减设置（点击「⚙️ 站点计算配置」为各平台添加，全产品通用）</div>';
  var chips=sites.map(function(s){
    var rules=parseCouponRules((siteCalc[s.id]||{}).coupon);
    return '<span class="sp-sku-cpn-site" title="'+escapeAttr(s.name+'：'+fmtCouponRules(rules))+'">'+s.name+' '+fmtCouponRules(rules)+'</span>';
  }).join('');
  return '<div class="sp-sku-cpn-bar"><div class="sp-cpn-title"><span class="sp-cpn-icon">🎟️</span> 优惠券（全产品通用）</div><div class="sp-cpn-chips">'+chips+'</div></div>';
}

    if(s.enName)tags.push('英文 '+escapeHtml(s.enName));
    tags.push('数量 '+(s.qty||0));
    tags.push('成本 ¥'+fmtNum(s.cost));
    tags.push('重量 '+fmtNum(s.weight)+'g');
    var tagHtml=tags.map(function(t){return '<span class="sp-sku-tag">'+t+'</span>';}).join('');
    return '<div class="sp-sku-card'+(open?' open':'')+'" data-pid="'+p.id+'">'+
      '<div class="sp-sku-card-top">'+
        '<button class="sp-sku-toggle'+(open?' open':'')+'" data-sku-toggle="'+si+'" title="查看/收起详细定价（藏价/佣金/成本/利润/ROAS）">'+(open?'▾':'▸')+'</button>'+
        '<span class="sp-sku-no">'+(s.skuNo?escapeHtml(fmtSkuNo(s.skuNo)):'<span style="color:var(--text-3)">—</span>')+'</span>'+
        '<span class="sp-sku-move"><button class="sp-sku-mv" data-sku-move="'+si+'" data-dir="-1"'+(si===0?' disabled':'')+' title="上移">▲</button><button class="sp-sku-mv" data-sku-move="'+si+'" data-dir="1"'+(si===skus.length-1?' disabled':'')+' title="下移">▼</button></span>'+
        '<span class="sp-sku-tags">'+tagHtml+'</span>'+
        (ordHtml?'<span class="sp-sku-orders">'+ordHtml+'</span>':'')+
      '</div>'+
      '<div class="sp-sku-card-sites" id="skuInline_'+p.id+'_'+si+'">'+renderSkuInlinePrices(p,s,si)+'</div>'+
      '<div class="sp-sku-exp-wrap'+(open?' open':'')+'">'+
        '<div class="sp-sku-calc-card"><div class="sp-cfg-hint">藏价/佣金率/汇率/优惠券引用「⚙️ 站点计算配置」；原价在 SKU 行内填写，<b>折扣在产品行 SKU 列统一设置</b>，其它成本、广告在此填写，自动实时计算</div>'+renderSkuCalcCardBody(p,s,si)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
  return '<div class="sp-sku-cards">'+cards+'</div>';

// ============ SKU 定价计算引擎（V26+）============
function ensureSiteCalc(){SHOPEE_SITES.forEach(function(s){if(!siteCalc[s.id])siteCalc[s.id]={hide:'',commission:s.commission,rate:s.rate,coupon:0};var c=siteCalc[s.id];if(c.enabled===undefined)c.enabled=!!c.hide;});}
function calcSitesEnabled(){ensureSiteCalc();return SHOPEE_SITES.filter(function(s){return siteCalc[s.id]&&siteCalc[s.id].enabled;});}
// ============ 汇率参考（V33 起：手动设置为主，仅拉取当天值作参考）============
// open.er-api.com 免费无需 key，返回「1 人民币 = X 外币」，因此本地汇率 = 1/X
var RATES_API='https://open.er-api.com/v6/latest/CNY';
var ratesRefKey='xiu_rates_ref_v1';
function getRatesRef(){try{var s=localStorage.getItem(ratesRefKey);return s?JSON.parse(s):null;}catch(e){return null;}}
function getRatesDate(){var ref=getRatesRef();return ref&&ref.date?ref.date:'';}
function autoUpdateRates(manual){
  return fetch(RATES_API).then(function(res){if(!res.ok)throw new Error('http '+res.status);return res.json();}).then(function(j){
    if(!j||j.result!=='success'||!j.rates)throw new Error('bad data');
    var ref={date:todayStr(),rates:{}};
    SHOPEE_SITES.forEach(function(s){
      var r=parseFloat(j.rates[s.currency]);
      if(r>0)ref.rates[s.id]=parseFloat((1/r).toFixed(5));
    });
    try{localStorage.setItem(ratesRefKey,JSON.stringify(ref));}catch(e){}
    if(manual){showToast('✅ 已拉取当天参考汇率（'+todayStr()+'），手动汇率保持不变');var m=MODULES[currentModule];if(m){var main=document.getElementById('main');if(main){main.innerHTML=m.render();m.init();}}}
    return Object.keys(ref.rates).length;
  }).catch(function(){if(manual)showToast('⚠️ 汇率拉取失败，请检查网络后重试');return 0;});
}
// 启动时静默检查：参考汇率不是当天则拉取（只更新参考值，绝不覆盖手动汇率）
function maybeAutoUpdateRates(){
  if(getRatesDate()===todayStr())return;
  autoUpdateRates(false);
}
function evalHidePrice(formula,w){
  if(!formula)return 0;
  try{
    var f=String(formula).replace(/MAX\(/g,'Math.max(').replace(/ROUND\(/g,'Math.round(').replace(/\bw\b/g,'('+w+')').replace(/×/g,'*').replace(/÷/g,'/');
    var v=new Function('return ('+f+');')();
    return isFinite(v)?v:0;
  }catch(e){return 0;}
}
// 优惠券满减规则解析：支持「满200减20；满400减60」/「200-20,400-60」/纯数字（无条件减）/留空
function parseCouponRules(v){
  var rules=[];
  if(v==null||String(v).trim()==='')return rules;
  var s=String(v).trim();
  if(/^-?[\d.]+$/.test(s)){var n=parseFloat(s);if(n>0)rules.push({min:0,off:n});return rules;}
  s.split(/[;；\n,，]+/).forEach(function(seg){
    seg=seg.trim();if(!seg)return;
    var m=seg.match(/满\s*([\d.]+)\s*(?:减|-)\s*([\d.]+)/)||seg.match(/^([\d.]+)\s*(?:减|-)\s*([\d.]+)/);
    if(m){var min=parseFloat(m[1]),off=parseFloat(m[2]);if(min>=0&&off>0)rules.push({min:min,off:off});}
  });
  rules.sort(function(a,b){return a.min-b.min;});
  return rules;
}
// 按折后价自动选择最优惠的一档满减
function appliedCoupon(discPrice,rules){
  var best=0;rules.forEach(function(r){if(discPrice>=r.min&&r.off>best)best=r.off;});
  return best;
}
function fmtCouponRules(rules){
  if(!rules||!rules.length)return '';
  return rules.map(function(r){return '满'+fmtNum(r.min)+'减'+fmtNum(r.off);}).join('；');
}
// 产品级折扣（V34）：p.disc={sid:百分比} 全 SKU 统一；兼容旧数据（SKU 级 pr.disc 迁移）
function prodDisc(p,sid){
  if(p.disc&&p.disc[sid]!=null&&p.disc[sid]!=='')return parseFloat(p.disc[sid])||0;
  var skus=p.skus||[];
  for(var i=0;i<skus.length;i++){
    var pr=(skus[i].price&&skus[i].price[sid])||{};
    if(pr.disc!=null&&pr.disc!=='')return parseFloat(pr.disc)||0;
  }

}
function calcSkuSite(sku,sid,pdisc){
  var s=getSite(sid);var cfg=siteCalc[sid]||{};
  var w=parseFloat(sku.weight)||0;
  var hide=evalHidePrice(cfg.hide,w);
  var rate=parseFloat(cfg.rate)||parseFloat(s.rate)||1;
  var commission=parseFloat(cfg.commission)!=null&&cfg.commission!==''?parseFloat(cfg.commission):parseFloat(s.commission)||0;
  var pr=(sku.price&&sku.price[sid])||{};
  var base=parseFloat(pr.base)||0,other=parseFloat(pr.other)||0,ad=parseFloat(pr.ad)||0;
  var disc=(pdisc!=null&&pdisc!=='')?(parseFloat(pdisc)||0):(parseFloat(pr.disc)||0);
  var cost=parseFloat(sku.cost)||0;
  var discPrice=base*(1-disc/100);
  var couponRules=parseCouponRules(cfg.coupon);
  var coupon=appliedCoupon(discPrice,couponRules);
  var appliedRule=null;
  couponRules.forEach(function(r){if(discPrice>=r.min&&r.off===coupon)appliedRule=r;});
  var finalLocal=Math.max(0,discPrice-coupon);
  // 汇率方向（V33 修正）：rate = 1 本地币 = X 人民币 → 本地→人民币用 ×rate，人民币→本地用 ÷rate
  var finalCny=finalLocal*rate;
  var hideCny=hide*rate;
  // 佣金按「折后价」计算（买家实际成交口径）
  var commLocal=discPrice*commission/100;
  var commCny=commLocal*rate;
  var totalCost=cost+hideCny+commCny+other+ad;
  var profit=finalCny-totalCost;
  var margin=finalCny>0?profit/finalCny*100:0;
  var roas=ad>0?finalCny/ad:(finalCny>0?999:0);
  return {hide:hide,hideCny:hideCny,rate:rate,commission:commission,coupon:coupon,couponRules:couponRules,appliedRule:appliedRule,base:base,disc:disc,other:other,ad:ad,cost:cost,discPrice:discPrice,finalLocal:finalLocal,finalCny:finalCny,commLocal:commLocal,commCny:commCny,totalCost:totalCost,profit:profit,margin:margin,roas:roas};
}

function importProducts(){

    $('spPriceSiteBody').innerHTML=body;
    function bind(id,key){var inp=$(id);if(inp)inp.addEventListener('input',function(){spPricing[pid][curSite]=spPricing[pid][curSite]||{};spPricing[pid][curSite][key]=this.value;saveData(SK.spPricing,spPricing);renderSite();});}

var ORD_RANGES=[{id:'all',name:'📊 全部'},{id:'180d',name:'🗓 近半年'},{id:'30d',name:'📅 近一月'},{id:'7d',name:'🕐 近7天'}];
function ordInRange(o,range){if(range==='all')return true;var days=range==='7d'?7:(range==='30d'?30:180);var t=new Date((o.date||'')+'T00:00:00').getTime();if(isNaN(t))return false;return (Date.now()-t)<=days*86400000;}
function renderStats(){
  var body=$('spStatsBody');if(!body)return;
  var range=ordRange;
  var orders=spOrders.filter(function(o){return ordInRange(o,range);});
  var totRev=0,totCost=0,totAd=0,totComm=0,totOrd=orders.length;
  var byProd={},byDay={},bySku={};
  orders.forEach(function(o){var s=getSite(o.site);var comm=(o.revenue||0)*s.commission/100;totRev+=(o.revenue||0);totCost+=(o.cost||0);totAd+=(o.adCost||0);totComm+=comm;var p=(o.revenue||0)-(o.cost||0)-comm-(o.adCost||0);var pn=o.product||'未命名';if(!byProd[pn])byProd[pn]={qty:0,rev:0,profit:0};byProd[pn].qty+=(o.qty||1);byProd[pn].rev+=(o.revenue||0);byProd[pn].profit+=p;var sk=o.sku||'';if(sk){if(!bySku[sk])bySku[sk]={qty:0,rev:0,profit:0};bySku[sk].qty+=(o.qty||1);bySku[sk].rev+=(o.revenue||0);bySku[sk].profit+=p;}var d=o.date||todayStr();if(!byDay[d])byDay[d]={orders:0,profit:0,ad:0};byDay[d].orders++;byDay[d].profit+=p;byDay[d].ad+=(o.adCost||0);});
  var totProfit=totRev-totCost-totComm-totAd;
  var roas=totAd>0?fmtNum(totRev/totAd):'-';
  var cards='<div class="sp-stat-grid">'+
    '<div class="sp-stat-card"><div class="stat-value">'+totOrd+'</div><div class="stat-label">订单数</div></div>'+
    '<div class="sp-stat-card"><div class="stat-value">'+fmtNum(totRev)+'</div><div class="stat-label">销售额</div></div>'+
    '<div class="sp-stat-card profit"><div class="stat-value">¥'+fmtNum(totProfit)+'</div><div class="stat-label">利润</div></div>'+
    '<div class="sp-stat-card ad"><div class="stat-value">¥'+fmtNum(totAd)+'</div><div class="stat-label">广告支出</div></div>'+
    '<div class="sp-stat-card"><div class="stat-value">'+roas+'</div><div class="stat-label">ROAS</div></div></div>';
  var html=cards;
  var skuKeys=Object.keys(bySku);
  if(skuKeys.length){
    var skuRows=skuKeys.map(function(k){return bySku[k];}).sort(function(a,b){return b.profit-a.profit;});
    html+='<div class="section-title">🔢 SKU 维度统计（联动产品 SKU 号）</div><div class="table-wrap"><table class="data-table"><thead><tr><th>SKU 号</th><th>销量</th><th>销售额</th><th>利润</th></tr></thead><tbody>'+skuRows.map(function(sk){var k=skuKeys[skuRows.indexOf(sk)];return '<tr><td class="sp-sku-no">'+escapeHtml(k)+'</td><td class="num">'+sk.qty+'</td><td class="num">'+fmtNum(sk.rev)+'</td><td class="num '+(sk.profit>=0?'profit-pos':'profit-neg')+'">'+fmtNum(sk.profit)+'</td></tr>';}).join('')+'</tbody></table></div>';
  }
  var prodRows=Object.keys(byProd).map(function(k){return byProd[k];}).sort(function(a,b){return b.profit-a.profit;});
  var topProd='<div class="section-title">🏆 热销产品</div><div class="table-wrap"><table class="data-table"><thead><tr><th>产品</th><th>销量</th><th>销售额</th><th>利润</th></tr></thead><tbody>'+prodRows.map(function(p){return '<tr><td>'+escapeHtml(Object.keys(byProd).find(function(k){return byProd[k]===p;}))+'</td><td class="num">'+p.qty+'</td><td class="num">'+fmtNum(p.rev)+'</td><td class="num '+(p.profit>=0?'profit-pos':'profit-neg')+'">'+fmtNum(p.profit)+'</td></tr>';}).join('')+'</tbody></table></div>';
  var days=Object.keys(byDay).sort().reverse().slice(0,14);
  var dayRows='<div class="section-title">📅 每日趋势</div><div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>订单数</th><th>利润</th><th>广告</th></tr></thead><tbody>'+days.map(function(d){var v=byDay[d];return '<tr><td>'+fmtDate(d)+'</td><td class="num">'+v.orders+'</td><td class="num '+(v.profit>=0?'profit-pos':'profit-neg')+'">'+fmtNum(v.profit)+'</td><td class="num">'+fmtNum(v.ad)+'</td></tr>';}).join('')+'</tbody></table></div>';
  html+=topProd+dayRows;
  body.innerHTML=html;
}

function collectFdItems(){var items=[];$('fdItems').querySelectorAll('.sku-row').forEach(function(r){items.push({desc:r.querySelector('[data-fi=desc]').value.trim(),qty:parseFloat(r.querySelector('[data-fi=qty]').value)||0,unit:r.querySelector('[data-fi=unit]').value.trim()||'PCS',price:parseFloat(r.querySelector('[data-fi=price]').value)||0});});return items.filter(function(i){return i.desc||i.price;});}
function buildFdHtml(){
  var type=$('fdType').value;var typeNames={quote:'QUOTATION 报价单',invoice:'COMMERCIAL INVOICE 发票',packing:'PACKING LIST 装箱单'};
  var cur=$('fdCurrency').value||'USD';var items=collectFdItems();

function renderPeriodCal(){
  var el=$('periodCal');if(!el)return;
  var y=periodCalDate.getFullYear(),m=periodCalDate.getMonth();
  var startDow=new Date(y,m,1).getDay();var daysInMonth=new Date(y,m+1,0).getDate();
  var today=todayStr();var recs={};psPeriods.forEach(function(p){recs[p.date]=p;});
  var sorted=psPeriods.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var gaps=[];for(var i=1;i<sorted.length;i++){var g=Math.round((new Date(sorted[i].date)-new Date(sorted[i-1].date))/86400000);if(g>15&&g<60)gaps.push(g);}
  var avgCycle=gaps.length>0?Math.round(gaps.reduce(function(a,b){return a+b;},0)/gaps.length):28;
  var lastStart=sorted.length>0?sorted[sorted.length-1].date:null;
  var nextPred=lastStart?new Date(new Date(lastStart).getTime()+avgCycle*86400000):null;
  var nextStr=nextPred?nextPred.getFullYear()+'-'+String(nextPred.getMonth()+1).padStart(2,'0')+'-'+String(nextPred.getDate()).padStart(2,'0'):null;
  var html='<div class="period-stats"><div class="period-stat">平均周期: <b>'+(gaps.length>0?avgCycle:'-')+'</b> 天</div><div class="period-stat">下次预计: <b>'+(nextStr?fmtDate(nextStr):'-')+'</b></div></div>';
  html+='<div class="period-cal-header"><button class="btn-icon" id="pmPrev">‹</button><span id="pmTitle">'+y+'年'+(m+1)+'月</span><button class="btn-icon" id="pmNext">›</button></div>';
  html+='<div class="period-calendar">';
  for(var w=0;w<7;w++)html+='<div class="period-day" style="font-weight:600;color:var(--text-2);cursor:default">'+'日一二三四五六'[w]+'</div>';
  for(var i=0;i<startDow;i++)html+='<div class="period-day empty"></div>';
  for(var d=1;d<=daysInMonth;d++){var ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');var cls='period-day';if(ds===today)cls+=' today';if(recs[ds])cls+=' period';else if(nextStr===ds)cls+=' predicted';html+='<div class="'+cls+'" data-date="'+ds+'">'+d+(recs[ds]?' ●':'')+'</div>';}
  html+='</div>';
  html+='<div class="section-title" style="margin-top:16px">经期记录 ('+psPeriods.length+')</div><div id="periodList">'+psPeriods.slice().sort(function(a,b){return a.date<b.date?1:-1;}).map(function(p){return '<div class="note-card"><div style="display:flex;justify-content:space-between;align-items:center"><span><b>'+fmtDate(p.date)+'</b> '+(p.flow||'')+'</span><button class="act-btn danger" data-pdel="'+p.id+'">🗑️</button></div>'+(p.note?'<div style="font-size:13px;color:var(--text-3);margin-top:4px">'+escapeHtml(p.note)+'</div>':'')+'</div>';}).join('')+'</div>';
  el.innerHTML=html;
  $('pmPrev').addEventListener('click',function(){periodCalDate.setMonth(periodCalDate.getMonth()-1);renderPeriodCal();});
  $('pmNext').addEventListener('click',function(){periodCalDate.setMonth(periodCalDate.getMonth()+1);renderPeriodCal();});
  el.querySelectorAll('.period-day[data-date]').forEach(function(c){c.addEventListener('click',function(){addPeriodRecord(c.dataset.date);});});
  el.querySelectorAll('[data-pdel]').forEach(function(b){b.addEventListener('click',function(){var id=b.dataset.pdel;psPeriods=psPeriods.filter(function(p){return p.id!==id;});saveData(SK.psPeriods,psPeriods);renderPeriodCal();showToast('已删除');});});
}

function logStudy(type,count){var today=todayStr();var log=getTodayLog();if(type==='word')log.wordsLearned=(log.wordsLearned||0)+count;else if(type==='sentence')log.sentencesLearned=(log.sentencesLearned||0)+count;else if(type==='review')log.reviewsDone=(log.reviewsDone||0)+count;log.date=today;var idx=studyLog.findIndex(function(e){return e.date===today;});if(idx>=0)studyLog[idx]=log;else studyLog.push(log);saveData(SK.studyLog,studyLog);checkAchievements();}
function getTodayLog(){var today=todayStr();var e=studyLog.find(function(e){return e.date===today;});return e||{date:today,wordsLearned:0,sentencesLearned:0,reviewsDone:0,studyTime:0};}
function getStreak(){if(studyLog.length===0)return 0;var sorted=studyLog.map(function(e){return e.date;}).sort().reverse();var streak=0;var today=new Date();for(var i=0;i<=365;i++){var d=new Date(today.getTime()-i*86400000);var ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(sorted.indexOf(ds)>=0)streak++;else if(i>0)break;}return streak;}

function addSrsItem(id,type){if(srsData[id])return;srsData[id]={type:type,reps:0,interval:0,ease:2.5,due:Date.now(),lastReview:0};saveData(SK.srsData,srsData);}
function getDueSrsItems(){var now=Date.now();return Object.keys(srsData).filter(function(k){return srsData[k].due<=now;}).map(function(k){var d=srsData[k];var item=null;if(d.type==='word'){item=wordFavorites.find(function(w){return w.word===k;});}if(!item){var s=allSentences.find(function(s){return s.id===k;});if(s)item=s;}return item?{key:k,data:d,item:item}:null;}).filter(Boolean);}
function rateSrs(id,quality){var d=srsData[id];if(!d)return;if(quality<3){d.reps=0;d.interval=1;}else{d.reps++;if(d.reps===1)d.interval=1;else if(d.reps===2)d.interval=6;else d.interval=Math.round(d.interval*d.ease);d.ease=Math.max(1.3,d.ease+(0.1-(5-quality)*(0.08+(5-quality)*0.02)));}d.due=Date.now()+d.interval*86400000;d.lastReview=Date.now();saveData(SK.srsData,srsData);logStudy('review',1);}
function getSrsStats(){var items=Object.values(srsData);var now=Date.now();return{total:items.length,due:items.filter(function(d){return d.due<=now;}).length,new:items.filter(function(d){return d.reps===0;}).length,learning:items.filter(function(d){return d.reps>0&&d.reps<3;}).length,mastered:items.filter(function(d){return d.reps>=5;}).length};}

MODULES['en-listening']={title:'\u542c\u529b\u7ec3\u4e60',render:function(){
  return '<div class="section"><div class="practice-score"><div class="practice-score-item"><div class="practice-score-val" id="lstScore">0</div><div class="practice-score-label">\u5f97\u5206</div></div><div class="practice-score-item"><div class="practice-score-val" id="lstTotal">0</div><div class="practice-score-label">\u603b\u9898</div></div></div><div id="lstArea"></div></div>';
},init:function(){listeningState={idx:0,score:0,total:0,curItem:null};renderListeningQuestion();}};
function renderListeningQuestion(){
  var el=$('lstArea');if(!el)return;
  var pool=allSentences.filter(function(s){return s.en&&s.en.length<120;});
  if(pool.length===0){el.innerHTML='<div class="empty-state"><p>\u6682\u65e0\u53e5\u5b50\u6570\u636e</p></div>';return;}
  var item=pool[Math.floor(Math.random()*pool.length)];
  listeningState.curItem=item;
  el.innerHTML='<div class="practice-area"><div class="practice-question" style="text-align:center"><button class="btn btn-primary" id="lstPlayBtn">\ud83d\udd0a \u70b9\u51fb\u542c\u53d6</button></div><div style="margin-top:12px"><input class="practice-input" id="lstInput" placeholder="\u542c\u5230\u4ec0\u4e48\u5c31\u5199\u4ec0\u4e48..."></div><div class="practice-actions"><button class="btn btn-primary" id="lstSubmit">\u63d0\u4ea4</button><button class="btn" id="lstSkip">\u8df3\u8fc7</button><button class="btn" id="lstReveal">\u770b\u539f\u6587</button></div><div id="lstResult"></div></div>';
  if($('lstPlayBtn'))$('lstPlayBtn').addEventListener('click',function(){speakSentence(item.en);});
  if($('lstSubmit'))$('lstSubmit').addEventListener('click',function(){checkListeningAnswer();});
  if($('lstSkip'))$('lstSkip').addEventListener('click',function(){listeningState.total++;updateListeningScore();renderListeningQuestion();});
  if($('lstReveal'))$('lstReveal').addEventListener('click',function(){$('lstResult').innerHTML='<div class="practice-result correct"><strong>\u539f\u6587:</strong> '+escapeHtml(item.en)+'<br><strong>\u4e2d\u6587:</strong> '+escapeHtml(item.zh)+'</div>';});
  if($('lstInput'))$('lstInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkListeningAnswer();});
}
function checkListeningAnswer(){
  var input=$('lstInput').value.trim().toLowerCase();
  var correct=listeningState.curItem.en.toLowerCase();
  listeningState.total++;
  if(input===correct){listeningState.score++;updateListeningScore();$('lstResult').innerHTML='<div class="practice-result correct">\u2705 \u5b8c\u5168\u6b63\u786e\uff01</div>';}
  else{var words=correct.split(' ');var userWords=input.split(' ');var match=0;words.forEach(function(w,i){if(userWords[i]&&userWords[i]===w)match++;});var pct=Math.round(match/words.length*100);if(pct>=80){listeningState.score++;updateListeningScore();$('lstResult').innerHTML='<div class="practice-result correct">\u2705 \u57fa\u672c\u6b63\u786e ('+pct+'%) \u539f\u6587: '+escapeHtml(listeningState.curItem.en)+'</div>';}else{$('lstResult').innerHTML='<div class="practice-result wrong">\u274c '+pct+'% \u539f\u6587: '+escapeHtml(listeningState.curItem.en)+'</div>';addMistake('listening',listeningState.curItem.en,input,listeningState.curItem.en);}}
  setTimeout(renderListeningQuestion,2000);
}
function updateListeningScore(){if($('lstScore'))$('lstScore').textContent=listeningState.score;if($('lstTotal'))$('lstTotal').textContent=listeningState.total;}

  var assessHtml='<div class="practice-actions" style="justify-content:center;margin-top:16px" id="spkAssessWrap"><span style="font-size:12px;color:var(--text-3);align-self:center">\u81ea\u8bc4\uff1a</span><button class="btn" data-q="0">\ud83d\ude14 \u8fd8\u9700\u7ec3\u4e60</button><button class="btn" data-q="3">\ud83d\ude42 \u4e00\u822c</button><button class="btn btn-primary" data-q="5">\ud83d\ude0e \u5f88\u6d41\u5229</button><button class="btn" id="spkNext">\u4e0b\u4e00\u53e5 \u2192</button></div>';
  el.insertAdjacentHTML('beforeend',assessHtml);
  el.querySelectorAll('#spkAssessWrap button[data-q]').forEach(function(b){b.addEventListener('click',function(){assessSpeaking(parseInt(b.dataset.q));});});
  if($('spkNext'))$('spkNext').addEventListener('click',function(){speakingState.total++;if($('spkTotal'))$('spkTotal').textContent=speakingState.total;renderSpeakingQuestion();});
  speakSentence(item.en);
}
function toggleSpeakingRec(){
  var st=$('spkStatus');
  if(speakingState.recording){stopSpeakingRec();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){if(st)st.textContent='\u8bbe\u5907\u4e0d\u652f\u6301\u5f55\u97f3\uff0c\u53ef\u76f4\u63a5\u70b9\u81ea\u8bc4';return;}
  if(!st)return;
  st.textContent='\u6b63\u5728\u8bf7\u6c42\u9ea6\u514b\u98ce\u6743\u9650...';
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    speakingState.stream=stream;speakingState.chunks=[];
    var mr;try{mr=new MediaRecorder(stream);}catch(e){st.textContent='\u5f55\u97f3\u4e0d\u53ef\u7528\uff0c\u53ef\u76f4\u63a5\u70b9\u81ea\u8bc4';return;}
    speakingState.recorder=mr;speakingState.recording=true;
    mr.ondataavailable=function(e){if(e.data&&e.data.size>0)speakingState.chunks.push(e.data);};
    mr.onstop=function(){var blob=new Blob(speakingState.chunks,{type:mr.mimeType||'audio/webm'});if(speakingState.audioUrl)URL.revokeObjectURL(speakingState.audioUrl);speakingState.audioUrl=URL.createObjectURL(blob);speakingState.hasRecording=true;if($('spkMine'))$('spkMine').style.display='';if($('spkAdd'))$('spkAdd').style.display='';if(st)st.textContent='\u5f55\u97f3\u5b8c\u6210\uff0c\u70b9\u51fb\u300c\u6211\u7684\u53d1\u97f3\u300d\u5bf9\u6bd4';};
    mr.start();
    if($('spkRec')){$('spkRec').textContent='\u23f9 \u505c\u6b62\u5f55\u97f3';$('spkRec').classList.add('btn-danger');}
    if(st)st.textContent='\u5f55\u97f3\u4e2d... \u8bf7\u5927\u58f0\u8bf4\u51fa\u4e0a\u65b9\u53e5\u5b50';
  }).catch(function(){if(st)st.textContent='\u65e0\u6cd5\u83b7\u53d6\u9ea6\u514b\u98ce\uff08\u8bf7\u5141\u8bb8\u6743\u9650\uff09\uff0c\u53ef\u76f4\u63a5\u70b9\u81ea\u8bc4';});
}
function stopSpeakingRec(){
  speakingState.recording=false;
  if(speakingState.recorder&&speakingState.recorder.state!=='inactive'){try{speakingState.recorder.stop();}catch(e){}}
  if(speakingState.stream){speakingState.stream.getTracks().forEach(function(t){t.stop();});}
  if($('spkRec')){$('spkRec').textContent='\ud83c\udfa4 \u91cd\u5f55';$('spkRec').classList.remove('btn-danger');}
}
function assessSpeaking(q){
  speakingState.total++;
  if(q>0){speakingState.score++;if($('spkScore'))$('spkScore').textContent=speakingState.score;}
  if($('spkTotal'))$('spkTotal').textContent=speakingState.total;
  if(q<3&&speakingState.curItem){addSrsItem(speakingState.curItem.id,'sentence');}
  if(q>=3){showToast(q>=5?'\ud83d\ude0e \u592a\u68d2\u4e86\uff01':'\ud83d\ude42 \u4e0d\u9519\uff0c\u7ee7\u7eed\u52a0\u6cb9');}
  setTimeout(renderSpeakingQuestion,900);
}

MODULES['en-fillblank']={title:'\u586b\u7a7a\u7ec3\u4e60',render:function(){
  return '<div class="section"><div class="practice-score"><div class="practice-score-item"><div class="practice-score-val" id="fbScore">0</div><div class="practice-score-label">\u6b63\u786e</div></div><div class="practice-score-item"><div class="practice-score-val" id="fbTotal">0</div><div class="practice-score-label">\u603b\u9898</div></div></div><div id="fbArea"></div></div>';
},init:function(){fillblankState={idx:0,score:0,total:0,curItem:null,blankedWord:''};renderFillBlankQuestion();}};
function renderFillBlankQuestion(){
  var el=$('fbArea');if(!el)return;
  var pool=favorites.map(function(id){return allSentences.find(function(s){return s.id===id;});}).filter(Boolean);
  if(pool.length<3)pool=allSentences.slice(0,100);
  if(pool.length===0){el.innerHTML='<div class="empty-state"><p>\u6682\u65e0\u53e5\u5b50\u6570\u636e</p></div>';return;}
  var item=pool[Math.floor(Math.random()*pool.length)];
  fillblankState.curItem=item;
  var words=item.en.split(' ');var wordIdxs=[];
  words.forEach(function(w,i){var clean=w.replace(/[^a-zA-Z]/g,'');if(clean.length>=4)wordIdxs.push(i);});
  if(wordIdxs.length===0){renderFillBlankQuestion();return;}
  var blankIdx=wordIdxs[Math.floor(Math.random()*wordIdxs.length)];
  fillblankState.blankedWord=words[blankIdx].replace(/[^a-zA-Z]/g,'').toLowerCase();
  var display=words.map(function(w,i){if(i===blankIdx)return '<span class="fb-blank">______</span>';return escapeHtml(w);}).join(' ');
  el.innerHTML='<div class="practice-area"><div class="practice-question">'+display+'</div><div style="font-size:13px;color:var(--text-3);margin-bottom:12px">\u4e2d\u6587: '+escapeHtml(item.zh)+'</div><input class="practice-input" id="fbInput" placeholder="\u586b\u5165\u7f3a\u5931\u7684\u5355\u8bcd..." autocomplete="off"><div class="practice-actions"><button class="btn btn-primary" id="fbSubmit">\u63d0\u4ea4</button><button class="btn" id="fbSkip">\u8df3\u8fc7</button><button class="btn" id="fbSpeak">\ud83d\udd0a</button></div><div id="fbResult"></div></div>';
  if($('fbSubmit'))$('fbSubmit').addEventListener('click',function(){checkFillBlankAnswer();});
  if($('fbSkip'))$('fbSkip').addEventListener('click',function(){fillblankState.total++;updateFillBlankScore();renderFillBlankQuestion();});
  if($('fbSpeak'))$('fbSpeak').addEventListener('click',function(){speakSentence(item.en);});
  if($('fbInput')){$('fbInput').focus();$('fbInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkFillBlankAnswer();});}
}
function checkFillBlankAnswer(){
  var input=$('fbInput').value.trim().toLowerCase();
  fillblankState.total++;
  if(input===fillblankState.blankedWord){fillblankState.score++;updateFillBlankScore();$('fbResult').innerHTML='<div class="practice-result correct">\u2705 \u6b63\u786e\uff01</div>';}
  else{$('fbResult').innerHTML='<div class="practice-result wrong">\u274c \u6b63\u786e: '+escapeHtml(fillblankState.blankedWord)+'</div>';addMistake('fillblank',fillblankState.curItem.en.replace(fillblankState.blankedWord,'_____'),input,fillblankState.blankedWord);}
  setTimeout(renderFillBlankQuestion,1500);
}
function updateFillBlankScore(){if($('fbScore'))$('fbScore').textContent=fillblankState.score;if($('fbTotal'))$('fbTotal').textContent=fillblankState.total;}

function renderScenarioStep(){

  var step=scn.steps.find(function(s){return s.id===scenarioState.curStep;});if(!step)return;
  var speakerLabel=step.speaker==='buyer'?'\ud83d\udc64 \u5ba2\u6237':step.speaker==='customer'?'\ud83d\ude4e \u5ba2\u6237':step.speaker==='you'?'\ud83d\udc66 \u4f60':'\ud83d\udc64';

  });});
}

{id:'iq6',en:"How do you manage time-sensitive orders?",zh:"你如何管理紧急订单？",ans:"For urgent orders, I prioritize communication. I immediately confirm all details with the customer, coordinate with the production team for the earliest delivery date, and arrange expedited shipping if needed. I also keep the customer updated at every stage.",ansZh:"对于紧急订单，我优先沟通。我立即与客户确认所有细节，与生产团队协调最早的交货日期，如需则安排加急运输。我还在每个阶段让客户了解最新进展。"},
{id:'iq7',en:"What is your experience with Alibaba or Made-in-China?",zh:"你有阿里巴巴或中国制造网的经验吗？",ans:"I have two years of experience using Alibaba International. I am skilled at managing product listings, responding to inquiries, and using data analytics to optimize our store performance. I have also used Made-in-China as a secondary platform.",ansZh:"我有两年使用阿里巴巴国际站的经验。我擅长管理产品列表、回复询盘、以及使用数据分析优化店铺表现。我还使用中国制造网作为辅助平台。"},
{id:'iq8',en:"How do you negotiate prices with overseas buyers?",zh:"你如何与海外买家谈价？",ans:"I believe in win-win negotiation. I start by understanding the customer budget and needs. Then I explain the value of our product - quality, service, delivery time. If they push for a lower price, I offer alternatives like adjusting order quantity or payment terms.",ansZh:"我相信双赢谈判。我首先了解客户的预算和需求。然后我解释我们产品的价值——质量、服务、交货时间。如果他们要求更低价格，我提供替代方案，比如调整订单数量或付款条件。"},
{id:'iq9',en:"What countries or regions have you exported to?",zh:"你出口过哪些国家或地区？",ans:"I have mainly exported to Southeast Asian countries including the Philippines, Singapore, Malaysia, and Vietnam. I also have some experience with customers from the Middle East and South America. Each market has its own preferences and requirements.",ansZh:"我主要出口到东南亚国家，包括菲律宾、新加坡、马来西亚和越南。我也有一些来自中东和南美客户的经验。每个市场都有自己的偏好和要求。"},
{id:'iq10',en:"How do you handle shipping and customs clearance?",zh:"你如何处理物流和清关？",ans:"I work closely with our freight forwarder to arrange shipping. For customs, I prepare all necessary documents including commercial invoices, packing lists, and certificates of origin. I also make sure to understand the import regulations of the destination country.",ansZh:"我与货代密切合作安排运输。清关方面，我准备所有必要的文件，包括商业发票、装箱单和原产地证书。我还确保了解目的地国家的进口法规。"},
{id:'iq11',en:"What is your English proficiency level?",zh:"你的英语水平如何？",ans:"I would say my English is at an intermediate level. I can communicate fluently with overseas clients via email and chat. For phone calls, I am comfortable handling most situations. I am also constantly improving my English through daily practice.",ansZh:"我的英语处于中级水平。我能通过邮件和聊天与海外客户流畅沟通。电话沟通方面，我能应对大多数情况。我也通过日常练习不断提高英语水平。"},
{id:'iq12',en:"How do you deal with after-sales complaints?",zh:"你如何处理售后投诉？",ans:"I handle complaints with empathy and urgency. First, I apologize and acknowledge the problem. Then I investigate the root cause quickly and offer a solution - replacement, refund, or discount. I follow up to ensure the customer is satisfied.",ansZh:"我以同理心和紧迫感处理投诉。首先，我道歉并确认问题。然后我快速调查根本原因并提供解决方案——换货、退款或折扣。我跟进确保客户满意。"},
{id:'iq13',en:"What makes a good foreign trade salesperson?",zh:"优秀的外贸业务员应具备什么素质？",ans:"A good foreign trade salesperson needs strong communication skills, patience, and cultural awareness. They should be proactive in finding clients, detail-oriented in handling orders, and resilient when facing rejection. Most importantly, they need to build trust through honesty.",ansZh:"优秀的外贸业务员需要良好的沟通能力、耐心和文化意识。他们应该主动寻找客户，注重细节处理订单，面对拒绝时有韧性。最重要的是，他们需要通过诚实来赢得信任。"},
{id:'iq14',en:"How do you find and develop new clients?",zh:"你如何寻找和开发新客户？",ans:"I use multiple channels: B2B platforms like Alibaba, social media like LinkedIn and Facebook, attending trade shows, and cold emailing. Once I make contact, I focus on building a relationship by understanding their needs and following up regularly.",ansZh:"我使用多种渠道：阿里巴巴等B2B平台、LinkedIn和Facebook等社交媒体、参加展会、以及冷邮件。一旦建立联系，我专注于通过了解需求和定期跟进来建立关系。"},
{id:'iq15',en:"What are your salary expectations?",zh:"你的期望薪资是多少？",ans:"Based on my experience and the industry standard, I am looking for a salary in the range of [amount]. However, I am more focused on the opportunity to grow with the company. I am open to discussing a compensation package that includes base salary plus commission.",ansZh:"根据我的经验和行业标准，我期望的薪资在[金额]范围内。不过，我更看重与公司一起成长的机会。我愿意讨论包含底薪加绩效提成的薪酬方案。"},
{id:'iq16',en:"Where do you see yourself in five years?",zh:"你五年后的发展规划是什么？",ans:"In five years, I see myself as a senior foreign trade manager, leading a team and handling key accounts. I want to deepen my expertise in cross-border e-commerce, especially in emerging markets. I also plan to improve my English to near-native fluency.",ansZh:"五年后，我希望成为一名高级外贸经理，带领团队并负责重要客户。我想深化在跨境电商方面的专业知识，特别是在新兴市场。我也计划将英语提升到接近母语水平。"},
{id:'iq17',en:"How do you handle cultural differences with international clients?",zh:"你如何处理与国际客户的文化差异？",ans:"I research the business culture of each country before communicating. For example, Southeast Asian clients value relationship-building before business, while Western clients prefer direct communication. I adjust my style accordingly and always show respect for their customs.",ansZh:"我在沟通前会研究每个国家的商业文化。例如，东南亚客户重视先建立关系再谈生意，而西方客户更喜欢直接沟通。我相应地调整方式，并始终尊重他们的习俗。"},
{id:'iq18',en:"What do you do when a customer does not respond?",zh:"客户不回复时你怎么做？",ans:"I follow up regularly but not aggressively. After the initial contact, I wait about three days before sending a gentle reminder. I might share relevant product updates or market insights. If there is still no response after a few attempts, I keep them in my contact list for future opportunities.",ansZh:"我会定期跟进但不会过于频繁。初次联系后，我等大约三天再发一封温和的提醒。我可能分享相关的产品更新或市场洞察。如果几次尝试后仍无回复，我保留联系方式以备将来机会。"},
{id:'iq19',en:"How do you handle product quality issues?",zh:"你如何处理产品质量问题？",ans:"Quality issues are taken very seriously. I first ask the customer for photos or videos to understand the problem. Then I coordinate with our quality control team to investigate. Based on the findings, I offer a solution - replacement, repair, or compensation.",ansZh:"质量问题非常受重视。我首先请客户提供照片或视频以了解问题。然后我协调质检团队调查。根据调查结果，我提供解决方案——换货、维修或赔偿。"},
{id:'iq20',en:"What payment terms are you familiar with?",zh:"你熟悉哪些付款方式？",ans:"I am familiar with T/T (telegraphic transfer), L/C (letter of credit), PayPal, and Western Union. For new customers, I usually recommend T/T with 30% deposit and 70% before shipment. For established customers, we can be more flexible.",ansZh:"我熟悉电汇(T/T)、信用证(L/C)、PayPal和西联汇款。对于新客户，我通常推荐T/T，30%定金，70%发货前付清。对于老客户，我们可以更灵活。"},
{id:'iq21',en:"How do you stay updated on industry trends?",zh:"你如何了解行业趋势？",ans:"I follow industry news through websites like Alibaba blog, trade publications, and LinkedIn groups. I also attend webinars and trade shows when possible. I find that talking to customers and suppliers is one of the best ways to understand market trends and customer needs.",ansZh:"我通过阿里巴巴博客、行业刊物和LinkedIn群组关注行业新闻。我也尽可能参加网络研讨会和展会。我发现与客户和供应商交流是了解市场趋势和客户需求的最佳方式之一。"},
{id:'iq22',en:"Describe a successful deal you closed.",zh:"描述一个你成功成交的订单。",ans:"Last year, I closed a deal with a Philippine distributor worth $80,000. They initially thought our price was too high. I arranged a video call to demonstrate our product quality and explained our after-sales support. I also offered a small discount for a larger order. They placed the order and became a regular customer.",ansZh:"去年，我与一位菲律宾经销商成交了一笔价值8万美元的订单。他们最初认为我们的价格太高。我安排了一次视频通话展示产品质量，并解释了售后支持。我还为大订单提供了小幅折扣。他们下了订单，此后成为固定客户。"},
{id:'iq23',en:"How do you handle competition?",zh:"你如何应对竞争？",ans:"I focus on differentiation rather than price wars. I highlight our product quality, customer service, and delivery reliability. I also build strong relationships with clients so they see the value in working with us beyond just price. Regular communication and proactive support help maintain customer loyalty.",ansZh:"我专注于差异化而非价格战。我强调我们的产品质量、客户服务和交货可靠性。我还与客户建立牢固的关系，让他们看到与我们合作的价值超越了价格。定期沟通和主动支持有助于维持客户忠诚度。"},
{id:'iq24',en:"What would you do in your first 30 days?",zh:"入职后前30天你会做什么？",ans:"In the first week, I would learn about the company products, systems, and target markets. In the second week, I would start handling existing inquiries. By week three, I would begin actively prospecting new clients. By day 30, I aim to have a clear pipeline and at least one new inquiry.",ansZh:"第一周，我会了解公司的产品、系统和目标市场。第二周，我会开始处理现有询盘。第三周，我会开始积极寻找新客户。到第30天，我的目标是建立清晰的客户管道并至少获得一个新询盘。"},
{id:'iq25',en:"How do you handle stress and pressure?",zh:"你如何处理压力？",ans:"I handle stress by staying organized and prioritizing tasks. When things get busy, I focus on the most urgent and important tasks first. I also believe in taking short breaks to clear my mind. Communication is key - if I am overwhelmed, I talk to my manager about adjusting priorities.",ansZh:"我通过保持条理和确定任务优先级来处理压力。忙碌时，我先专注于最紧急和最重要的任务。我也相信短暂休息能让头脑清醒。沟通是关键——如果感到不堪重负，我会与经理讨论调整优先级。"},
{id:'iq26',en:"What is your experience with cross-border e-commerce platforms?",zh:"你有跨境电商平台经验吗？",ans:"I have experience with Shopee and Lazada for Southeast Asian markets. I am familiar with product listing optimization, pricing strategies, and handling customer reviews. I also understand the logistics and payment systems. I have helped increase store ratings from 4.2 to 4.7 in six months.",ansZh:"我有Shopee和Lazada东南亚市场经验。我熟悉产品列表优化、定价策略和处理客户评价。我也了解物流和支付系统。我曾帮助店铺评分在六个月内从4.2提升到4.7。"},
{id:'iq27',en:"How do you prepare for a trade show?",zh:"你如何准备展会？",ans:"I start by researching the attendee list to identify potential clients. I prepare product samples, brochures, and business cards. I make sure our booth is attractive and our pitch is clear. During the show, I collect contacts and take notes on each conversation for follow-up.",ansZh:"我首先研究参会者名单以识别潜在客户。我准备产品样品、宣传册和名片。我确保展位有吸引力，推介清晰。展会期间，我收集联系方式并记录每次对话内容以便后续跟进。"},
{id:'iq28',en:"What are your strengths?",zh:"你的优点是什么？",ans:"My main strengths are communication, persistence, and adaptability. I am good at building relationships with clients and understanding their needs. I do not give up easily when facing challenges. I also adapt quickly to new products, markets, and situations.",ansZh:"我的主要优点是沟通、坚持和适应能力。我擅长与客户建立关系并理解他们的需求。面对挑战时我不轻易放弃。我也能快速适应新产品、新市场和新情况。"},
{id:'iq29',en:"What are your weaknesses?",zh:"你的缺点是什么？",ans:"I sometimes spend too much time trying to perfect every detail, which can slow things down. I have been working on this by setting time limits for each task. I am also continuing to improve my spoken English, especially for complex negotiations.",ansZh:"我有时会花太多时间试图完善每个细节，这可能拖慢进度。我一直在通过为每项任务设定时间限制来改善。我也在继续提高英语口语，特别是复杂谈判方面。"},
{id:'iq30',en:"Do you have any questions for us?",zh:"你有什么问题想问我们吗？",ans:"Yes, I would like to know more about the team structure and the main markets the company is focusing on. What are the expectations for the first three months? Also, how does the company support professional development and training for foreign trade staff?",ansZh:"是的，我想了解更多关于团队结构和公司主要专注的市场。前三个月的期望是什么？另外，公司如何支持外贸员工的专业发展和培训？"}
];

{id:'is18',en:"Could you clarify what you mean by that?",zh:"您能说明一下那是什么意思吗？"},
{id:'is19',en:"I am a quick learner and adaptable.",zh:"我学得快，适应能力强。"},
{id:'is20',en:"I enjoy working in a team environment.",zh:"我喜欢在团队环境中工作。"},
{id:'is21',en:"I take pride in delivering quality work.",zh:"我以提供高质量工作为荣。"},
{id:'is22',en:"Can you tell me about the company culture?",zh:"您能介绍一下公司文化吗？"},
{id:'is23',en:"I am comfortable making cold calls to potential clients.",zh:"我不介意给潜在客户打陌生电话。"},

{id:'is26',en:"I am detail-oriented and organized.",zh:"我注重细节，做事有条理。"},
{id:'is27',en:"I believe I am a good fit for this position.",zh:"我相信我适合这个职位。"},

{id:'is31',en:"I am passionate about international trade.",zh:"我对国际贸易充满热情。"},

MODULES['en-interview']={title:'\u5916\u8d38\u9762\u8bd5',render:function(){
  var qN=INTERVIEW_Q.length+interviewCustom.filter(function(x){return x.type==='q';}).length;
  var sN=INTERVIEW_SPOKEN.length+interviewCustom.filter(function(x){return x.type==='speak';}).length;
  var tabs='<div class="email-cat-tabs"><button class="email-cat-tab '+(interviewTab==='q'?'active':'')+'" data-itab="q">\u2753 \u9762\u8bd5\u95ee\u9898 ('+qN+')</button><button class="email-cat-tab '+(interviewTab==='speak'?'active':'')+'" data-itab="speak">\ud83d\udcac \u9762\u8bd5\u53e3\u8bed ('+sN+')</button></div>';
  return '<div class="section"><div class="section-title">\ud83d\udcbc \u5916\u8d38\u82f1\u6587\u9762\u8bd5</div><p style="font-size:13px;color:var(--text-3);margin-bottom:12px">\u5e38\u89c1\u9762\u8bd5\u95ee\u9898\u4e0e\u53e3\u8bed\u8868\u8fbe\uff0c\u70b9\u51fb\u2764\ufe0f\u6536\u85cf\u5230\u53e5\u5b50\u5b66\u4e60\uff0c\u70b9\u51fb\u2702\ufe0f\u6dfb\u52a0\u81ea\u5df1\u7684</p>'+tabs+'<div id="interviewList"></div><div class="add-panel" id="ivAddPanel"><div class="add-panel-inner"><div class="add-panel-header"><span id="ivAddTitle">\u2795 \u6dfb\u52a0\u9762\u8bd5\u5185\u5bb9</span><button class="mode-toggle-btn" id="ivToggle">\uff0d</button></div><div class="form-group" style="margin-top:8px"><label class="form-label">\u7c7b\u578b</label><select class="form-input" id="ivType"><option value="q">\u2753 \u9762\u8bd5\u95ee\u9898</option><option value="speak">\ud83d\udcac \u9762\u8bd5\u53e3\u8bed</option></select></div><div class="form-group"><label class="form-label">\u82f1\u6587</label><textarea class="form-input en-area" id="ivEn" rows="2" placeholder="Type English here..." style="font-family:var(--serif);resize:vertical"></textarea></div><div class="form-group"><label class="form-label">\u4e2d\u6587</label><textarea class="form-input" id="ivZh" rows="2" placeholder="\u8f93\u5165\u4e2d\u6587\u7ffb\u8bd1..." style="resize:vertical"></textarea></div><button class="btn btn-primary" id="ivSaveBtn" style="width:100%;margin-top:4px">\u4fdd\u5b58</button></div></div><div style="text-align:center;padding:8px"><button class="btn btn-ghost" id="ivFab">\u2795 \u6dfb\u52a0\u9762\u8bd5\u5185\u5bb9</button></div></div>';
},init:function(){
  document.querySelectorAll('[data-itab]').forEach(function(t){t.addEventListener('click',function(){interviewTab=t.dataset.itab;document.querySelectorAll('[data-itab]').forEach(function(x){x.classList.toggle('active',x===t);});renderInterviewList();});});
  renderInterviewList();
  var fab=$('ivFab');if(fab)fab.addEventListener('click',function(){var p=$('ivAddPanel');if(p)p.classList.add('open');var e=$('ivEn');if(e)setTimeout(function(){e.focus();},100);});
  var tg=$('ivToggle');if(tg)tg.addEventListener('click',function(){var p=$('ivAddPanel');if(p)p.classList.remove('open');});
  var sv=$('ivSaveBtn');if(sv)sv.addEventListener('click',saveInterviewItem);
}};
function renderInterviewList(){
  var el=$('interviewList');if(!el)return;
  var built=interviewTab==='q'?INTERVIEW_Q:INTERVIEW_SPOKEN;
  var custom=interviewCustom.filter(function(x){return x.type===interviewTab;});
  var all=built.concat(custom);
  if(!all.length){el.innerHTML='<div class="empty-state"><div class="empty-state-icon">📌</div><p>还没有内容</p></div>';return;}
  var html=all.map(function(item,idx){
    var isCustom=!built.some(function(x){return x.id===item.id;});
    var tagHtml=isCustom?'<span class="card-tag" style="background:var(--accent-l);color:var(--accent)">我的</span>':'<span class="card-tag" style="background:var(--primary-l);color:var(--primary)">系统</span>';
    var h='<div class="card" style="padding:14px 16px"><div class="card-top"><span class="card-serial">#'+(idx+1)+'</span><div class="card-tags">'+tagHtml+'</div></div>';
    h+='<div class="card-en">'+escapeHtml(item.en)+'</div><div class="card-zh">'+escapeHtml(item.zh)+'</div>';
    h+='<div class="card-actions"><button class="act-btn" data-iv-speak="'+escapeAttr(item.en)+'">🔊</button><button class="act-btn" data-iv-copy="'+escapeAttr(item.en)+'">📋</button>';
    if(item.ans){h+='<button class="act-btn" data-iv-ans="'+escapeAttr(item.id)+'">💬 答案</button>';}
    if(!isCustom){h+='<button class="act-btn" data-iv-fav="'+escapeAttr(item.id)+'">❤️ 收藏</button>';}
    else{h+='<button class="act-btn" data-iv-edit="'+escapeAttr(item.id)+'">✏️</button><button class="act-btn danger" data-iv-del="'+escapeAttr(item.id)+'">🗑️</button>';}
    h+='</div>';
    if(item.ans){
      h+='<div class="iv-ans-box" id="ivAnsBox_'+item.id+'" style="display:none;margin-top:8px;padding:10px;background:var(--bg-2);border-radius:8px;border-left:3px solid var(--primary)">';
      h+='<div style="font-size:12px;color:var(--text-3);margin-bottom:6px">💡 参考答案</div>';
      h+='<div class="card-en" style="font-size:13px;line-height:1.6;margin-bottom:6px">'+escapeHtml(item.ans)+'</div>';

MODULES['en-calendar']={title:'\u5b66\u4e60\u65e5\u5386',render:function(){

  var cells='';

  else advice='\u8868\u73b0\u4f18\u79c0\uff01\u5c1d\u8bd5\u60c5\u666f\u5bf9\u8bdd\u548c\u90ae\u4ef6\u6a21\u677f\uff0c\u5b9e\u6218\u5e94\u7528\u6240\u5b66\u3002';
  return '<div class="section"><div class="report-section"><div class="section-title">\ud83d\udcca \u672c\u5468\u5b66\u4e60\u7edf\u8ba1</div><div class="report-bar-chart">'+weekChart+'</div></div><div class="report-section"><div class="section-title">\ud83d\udcc5 \u8fd17\u5929\u6d3b\u52a8</div><div class="report-bar-chart">'+(recent7||'<div style="color:var(--text-3);font-size:13px">\u6682\u65e0\u8bb0\u5f55</div>')+'</div></div><div class="report-section"><div class="section-title">\ud83c\udfaf \u7d2f\u8ba1\u6210\u679c</div><div class="daily-stats"><div class="ds-item"><span class="ds-val">'+allTimeWords+'</span><span class="ds-label">\u603b\u5355\u8bcd</span></div><div class="ds-item"><span class="ds-val">'+allTimeReviews+'</span><span class="ds-label">\u603b\u590d\u4e60</span></div><div class="ds-item"><span class="ds-val">'+wordFavorites.length+'</span><span class="ds-label">\u6536\u85cf\u8bcd</span></div><div class="ds-item"><span class="ds-val">'+srsStats.total+'</span><span class="ds-label">SRS\u5361</span></div><div class="ds-item"><span class="ds-val">'+srsStats.mastered+'</span><span class="ds-label">\u5df2\u638c\u63e1</span></div><div class="ds-item"><span class="ds-val">'+getStreak()+'</span><span class="ds-label">\u8fde\u7eed\u5929</span></div></div></div><div class="report-section" style="background:var(--primary-l)"><div style="font-size:14px;line-height:1.6">\ud83d\udca1 <strong>\u5b66\u4e60\u5efa\u8bae</strong><br>'+advice+'</div></div></div>';

async function hashPwd(salt,pwd){var s=salt+'::'+pwd;try{if(window.crypto&&window.crypto.subtle&&window.TextEncoder){var buf=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(function(b){return ('0'+b.toString(16)).slice(-2);}).join('');}}catch(e){}var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return 'x'+(h>>>0).toString(16);}

function onAvatarFile(input){try{var file=input.files&&input.files[0];if(!file)return;if(!/^image\//.test(file.type)){showToast('请选择图片文件');return;}var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){var s=120;var cv=document.createElement('canvas');cv.width=s;cv.height=s;var ctx=cv.getContext('2d');var m=Math.min(img.width,img.height);var sx=(img.width-m)/2,sy=(img.height-m)/2;ctx.drawImage(img,sx,sy,m,m,0,0,s,s);var dataUrl=cv.toDataURL('image/jpeg',0.72);if(setAvatarData(dataUrl)){updateAvatarUI();showToast('头像已更新');scheduleSync();}};img.onerror=function(){showToast('图片读取失败，请换一张');};img.src=e.target.result;};reader.onerror=function(){showToast('图片读取失败');};reader.readAsDataURL(file);}catch(e){showToast('头像上传失败');}input.value='';}

 id="authSubmitBtn">注 册</button>'+toolsRow;}
function setAuthMode(mo){var lt=document.getElementById('authTabLogin'),rt=document.getElementById('authTabReg'),f=document.getElementById('authForm');if(!f)return;if(lt&&rt){if(mo==='login'){lt.classList.add('active');rt.classList.remove('active');}else{rt.classList.add('active');lt.classList.remove('active');}}f.innerHTML=authFormHTML(mo);var sb=document.getElementById('authSubmitBtn');if(sb)sb.addEventListener('click',function(){if(mo==='login')doLogin();else doRegister();});var dBtn=document.getElementById('authDiagBtn');if(dBtn)dBtn.addEventListener('click',diagSync);var uBtn=document.getElementById('authForceUpdateBtn');if(uBtn)uBtn.addEventListener('click',forceUpdateBtnClick);}
function authBusy(txt){var b=document.getElementById('authSubmitBtn');if(b){b.disabled=true;b.textContent=txt;}}
function authIdle(txt){var b=document.getElementById('authSubmitBtn');if(b){b.disabled=false;b.textContent=txt;}}
async function doLogin(){var u=(document.getElementById('authUser')?document.getElementById('authUser').value.trim():'');var p=(document.getElementById('authPass')?document.getElementById('authPass').value:'');var team=(document.getElementById('authTeam')?document.getElementById('authTeam').value.trim():'');var bucket=team||getTeamBucket();if(!bucket){var paramB=getUrlParam('bucket');if(paramB)bucket=paramB;}if(!bucket){var la0=localAccs()[u];if(la0&&la0.bucket)bucket=la0.bucket;}if(!bucket){try{var snapB=localStorage.getItem(SK.syncBucket+'__u_'+u);if(snapB)bucket=snapB;}catch(e){}}if(!bucket){var la0b=localAccs()[u];if(la0b&&!la0b.bucket){showToast('该账号是「本机账号」，未开通云同步。请在已登录的设备「个人中心」开通云同步');return;}showToast('请填写登录码：在已登录的手机端「个人中心」复制登录码');return;}if(!isValidBucketId(bucket)){authIdle('登 录');alert('登录码格式不对。\n\n你填的「'+bucket+'」不是有效的云端同步码。\n\n正确做法：\n1. 在手机端打开应用 → 个人中心\n2. 点「📧 一键开通云同步」\n3. 复制显示的「我的登录码」（长串随机字符）\n4. 把长串粘贴到电脑端的「登录码」框里');return;}authBusy('检查云端存储…');var bst=await getBucketStatus(bucket);if(!bst.ok){authIdle('登 录');var reason=bst.reason==='unverified'?'该登录码对应的云端存储未验证，无法同步。':(bst.reason==='net'?'网络连接失败，请检查网络。':'该登录码无效或不可用。');alert('无法登录：'+reason+'\n\n解决方法：\n1. 在已登录设备上点「📧 一键开通云同步」换一个可用登录码\n2. 或清除本设备缓存后重新开通');return;}authBusy('验证账号中…');var acc=await fetchAcc(bucket,u,15000);if(acc&&acc.netErr){var la=localAccs()[u];if(la){var lh=await hashPwd(la.salt,p);if(lh===la.hash){if(la.bucket!==bucket){la.bucket=bucket;saveLocalAcc(u,la);}authIdle('登 录');loginDone(u,bucket);return;}}authIdle('登 录');showToast('连接云端超时，请检查网络后重试。提示：如果多次失败，可在已登录设备点「分享登录链接」发给本设备');return;}if(!acc){authIdle('登 录');showToast('账号不存在，或登录码不对（注意大小写）。登录码需从已登录设备复制');return;}var h=await hashPwd(acc.salt,p);if(h!==acc.hash){authIdle('登 录');showToast('密码错误');return;}saveLocalAcc(u,{u:u,salt:acc.salt,hash:acc.hash,bucket:bucket,createdAt:acc.createdAt});authIdle('登 录');loginDone(u,bucket);}
function loginDone(u,bucket){var oldUser=getCurrentUser();if(oldUser&&oldUser!==u){snapshotCurrentUser();restoreUserSnapshot(u);}else if(oldUser!==u){restoreUserSnapshot(u);}localStorage.setItem('xiu_current_user',u);localStorage.setItem('xiu_auth_state','user');if(bucket){localStorage.setItem(SK.syncBucket,bucket);syncBucketId=bucket;try{localStorage.setItem('xiu_need_pull','1');}catch(e){}}hideAuthGate();location.reload();}
async function doRegister(){var u=(document.getElementById('authUser')?document.getElementById('authUser').value.trim():'');var p=(document.getElementById('authPass')?document.getElementById('authPass').value:'');var p2=(document.getElementById('authPass2')?document.getElementById('authPass2').value:'');var team=(document.getElementById('authTeam')?document.getElementById('authTeam').value.trim():'');if(!u||u.length<2){showToast('账号至少2个字符');return;}if(!p||p.length<4){showToast('密码至少4位');return;}if(p!==p2){showToast('两次密码不一致');return;}authBusy('注册中…');var salt=Math.random().toString(36).slice(2,12);var hash=await hashPwd(salt,p);var rec={u:u,salt:salt,hash:hash,createdAt:Date.now()};var bucket=team||getTeamBucket();if(!bucket){saveLocalAcc(u,rec);authIdle('注 册');snapshotCurrentUser();localStorage.setItem('xiu_current_user',u);localStorage.setItem('xiu_auth_state','user');hideAuthGate();showToast('注册成功（本机账号）');setTimeout(function(){alert('⚠️ 刚注册的是「本机账号」，只能在这台设备使用。\n\n想让手机也能登录：\n个人中心 → 云端同步 → 点「📧 一键开通云同步」即可，无需邮箱验证。');location.reload();},700);return;}if(bucket&&!isValidBucketId(bucket)){authIdle('注 册');alert('你填的登录码「'+bucket+'」格式不对，不是有效的云端同步码。\n\n登录码应从已登录设备的「个人中心 → 我的登录码」复制，是长串随机字符。');return;}var acc=await fetchAcc(bucket,u);if(acc&&!acc.netErr&&acc.u){authIdle('注 册');showToast('该账号已被注册，请直接登录');return;}saveLocalAcc(u,rec);var ok=await putAcc(bucket,u,rec);snapshotCurrentUser();localStorage.setItem('xiu_current_user',u);localStorage.setItem('xiu_auth_state','user');localStorage.setItem(SK.syncBucket,bucket);syncBucketId=bucket;if(ok){try{await doSync();}catch(e){}}hideAuthGate();location.reload();}

function doLogout(){snapshotCurrentUser();restoreUserSnapshot('__guest');localStorage.removeItem('xiu_current_user');localStorage.setItem('xiu_auth_state','guest');localStorage.removeItem(SK.syncBucket);location.reload();}
